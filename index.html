<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Glasfaser Hausbegehung v6.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ===== MODUL 1: STYLES (CSS) — START ===== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #f0f2f5; overflow: hidden; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; }

.header { background: white; padding: 10px 14px; box-shadow: 0 1px 8px rgba(0,0,0,0.09); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 100; min-height: 54px; }
.header-title { font-size: 16px; font-weight: 700; color: #1a1a1a; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.header-address { flex: 1; min-width: 140px; max-width: 280px; }
.header-address input { width: 100%; padding: 7px 11px; border: 1.5px solid #e5e5e7; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; color: #1a1a1a; background: #f9f9f9; transition: border-color 0.15s, background 0.15s; }
.header-address input:focus { border-color: #007AFF; background: white; }
.header-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }

button { border: none; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 13px; transition: all 0.14s; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px; -webkit-user-select: none; user-select: none; }
.btn { padding: 8px 13px; min-height: 36px; }
.btn-primary { background: linear-gradient(135deg, #007AFF, #0055CC); color: white; box-shadow: 0 2px 8px rgba(0,122,255,0.25); }
.btn-success { background: linear-gradient(135deg, #34C759, #1E8A39); color: white; box-shadow: 0 2px 8px rgba(52,199,89,0.25); }
.btn-danger { background: linear-gradient(135deg, #FF3B30, #C0190A); color: white; }
.btn-secondary { background: white; color: #007AFF; border: 1.5px solid #007AFF; padding: 6px 11px; min-height: 36px; }
.btn-ghost { background: #f0f2f5; color: #555; border: 1px solid #ddd; padding: 6px 10px; min-height: 34px; font-size: 14px; }
button:active { transform: scale(0.95); }

#statusBar { position: fixed; top: 108px; left: 50%; transform: translateX(-50%); padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 700; display: none; pointer-events: none; }
.status-success { background: #d4edda; color: #155724; display: block !important; }
.status-error { background: #f8d7da; color: #721c24; display: block !important; }
.status-info { background: #d1ecf1; color: #0c5460; display: block !important; }

.drawing-banner { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #007AFF, #0055CC); color: white; padding: 9px 16px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,122,255,0.4); display: none; align-items: center; gap: 8px; z-index: 800; white-space: nowrap; font-size: 13px; font-weight: 600; pointer-events: auto; }
.drawing-banner.active { display: flex; }
.drawing-banner button { background: rgba(255,255,255,0.18); color: white; padding: 5px 11px; border-radius: 7px; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,0.25); min-height: auto; }

.main-container { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* === LEFT TOOLBAR === */
.toolbar { width: 230px; background: white; border-right: 1px solid #e8e8ea; overflow-y: auto; overflow-x: hidden; padding: 10px 9px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
.tool-section { display: flex; flex-direction: column; gap: 4px; }
.tool-section-title { font-weight: 700; font-size: 9px; color: #a0a0a5; text-transform: uppercase; letter-spacing: 0.9px; padding: 0 2px 4px; border-bottom: 1px solid #f0f0f2; margin-bottom: 1px; }
.tool-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tool-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
.tool-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.tool-grid-1 { display: grid; grid-template-columns: 1fr; gap: 3px; }

.icon-btn { padding: 5px 3px; min-height: 52px; border: 1.5px solid #e8e8ea; border-radius: 10px; background: white; cursor: pointer; transition: all 0.14s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; -webkit-user-select: none; user-select: none; }
.icon-btn svg { width: 40px; height: 26px; display: block; }
.icon-label { font-size: 9px; font-weight: 600; color: #888; line-height: 1; }
.icon-btn:active { transform: scale(0.93); background: #EFF6FF; border-color: #007AFF; }
.icon-btn.active { background: #EFF6FF; border-color: #007AFF; }
.icon-btn.active .icon-label { color: #007AFF; }

/* Select-Tool Button */
.select-tool-btn { width: 100%; padding: 8px 12px; min-height: 40px; border: 1.5px solid #e8e8ea; border-radius: 10px; background: white; font-size: 12px; font-weight: 700; color: #555; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.15s; margin-bottom: 2px; }
.select-tool-btn.active { background: #EFF6FF; border-color: #007AFF; color: #007AFF; box-shadow: 0 2px 8px rgba(0,122,255,0.15); }
.select-tool-btn:active { transform: scale(0.97); }

.num-btn { padding: 4px 2px; min-height: 36px; border: 1.5px solid #e8e8ea; border-radius: 8px; background: white; cursor: pointer; font-size: 15px; font-weight: 800; color: #1a1a1a; transition: all 0.14s; -webkit-user-select: none; user-select: none; }
.num-btn:active { background: #EFF6FF; border-color: #007AFF; transform: scale(0.93); }

.text-btn { padding: 7px 9px; min-height: 34px; border: 1.5px solid #e8e8ea; border-radius: 8px; background: white; cursor: pointer; font-size: 11px; font-weight: 600; color: #1a1a1a; text-align: left; transition: all 0.14s; -webkit-user-select: none; user-select: none; display: flex; align-items: center; }
.text-btn:active { background: #EFF6FF; border-color: #007AFF; transform: scale(0.97); }
.text-btn-special { background: #FFFBEB; border-color: #F5A623; color: #A06800; }

/* === CANVAS AREA === */
.canvas-area { flex: 1; overflow-y: auto; padding: 14px; background: #f0f2f5; -webkit-overflow-scrolling: touch; min-width: 0; }

.image-card { background: white; border-radius: 14px; margin-bottom: 18px; padding: 13px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); position: relative; border: 2px solid transparent; transition: border-color 0.2s; }
.image-card.active-image { border-color: #007AFF; box-shadow: 0 2px 20px rgba(0,122,255,0.12); }
.image-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f2; flex-wrap: wrap; gap: 6px; }
.image-card-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; color: #1a1a1a; flex: 1; min-width: 0; }
.image-number-badge { width: 27px; height: 27px; background: linear-gradient(135deg, #007AFF, #0055CC); color: white; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.image-number-badge.no-pagenum { background: #bbb; }
.image-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #777; }
.image-card-actions { display: flex; gap: 4px; flex-wrap: wrap; }

.card-btn { padding: 5px 9px; min-height: 30px; border: 1.5px solid #e8e8ea; border-radius: 7px; background: white; color: #333; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.14s; display: flex; align-items: center; gap: 3px; }
.card-btn:active { transform: scale(0.95); background: #f5f5f7; }
/* Radierer: grün wenn aktiv, grau wenn inaktiv */
.card-btn.eraser-active { background: #EDFFF2; border-color: #34C759; color: #1A7A35; }
.card-btn.danger { color: #FF3B30; border-color: #FF3B3055; }
.card-btn.pagenum-off { color: #aaa; border-color: #ddd; }

.image-card-canvas-wrapper { position: relative; background: #f5f5f7; border-radius: 10px; overflow: auto; display: flex; justify-content: center; align-items: flex-start; min-height: 200px; }

canvas { display: block; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; cursor: crosshair; }
canvas.eraser-mode { cursor: cell; }
canvas.pencil-mode { cursor: crosshair; }
canvas.select-mode { cursor: default; }

.image-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f2; font-size: 11px; color: #999; flex-wrap: wrap; gap: 6px; }
.zoom-controls { display: flex; align-items: center; gap: 3px; }
.zoom-btn { width: 26px; height: 26px; padding: 0; border-radius: 6px; background: #f0f0f2; color: #333; border: 1px solid #e0e0e2; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.zoom-btn:active { background: #e0e0e5; transform: scale(0.93); }
.zoom-level { font-size: 11px; color: #333; font-weight: 600; min-width: 38px; text-align: center; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; color: #999; }
.empty-state h2 { font-size: 20px; margin-bottom: 8px; color: #1a1a1a; }
.empty-state p { font-size: 14px; margin-bottom: 20px; max-width: 380px; }
.empty-icon { font-size: 54px; margin-bottom: 14px; opacity: 0.35; }

/* === ELEMENT DELETE OVERLAY (×-Button über Canvas) === */
#elemDeleteBtn {
  position: fixed;
  display: none;
  width: 32px; height: 32px;
  background: #FF3B30;
  color: white;
  border-radius: 50%;
  font-size: 18px;
  font-weight: 700;
  z-index: 600;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(255,59,48,0.45);
  border: 2px solid white;
  touch-action: none;
  pointer-events: auto;
}
#elemDeleteBtn.visible { display: flex; }

/* === PAGE OVERVIEW (right) === */
.page-overview { width: 188px; background: white; border-left: 1px solid #e8e8ea; overflow-y: auto; padding: 12px 9px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.page-overview-header { font-weight: 700; font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.6px; padding-bottom: 6px; border-bottom: 1px solid #f0f0f2; display: flex; justify-content: space-between; align-items: center; white-space: nowrap; }
/* Aktionen nur sichtbar wenn .show-actions */
.page-overview-actions { display: none; flex-direction: column; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f2; }
.page-overview-actions.show-actions { display: flex; }
.po-action-btn { padding: 6px 8px; font-size: 10px; background: white; border: 1.5px solid #e8e8ea; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: all 0.14s; }
.po-action-btn:active { background: #EFF6FF; border-color: #007AFF; transform: scale(0.97); }
/* Kleiner Toggle-Button für Auswahl-Modus */
.po-select-toggle { font-size: 9px; padding: 3px 7px; min-height: 22px; border-radius: 6px; background: #f0f2f5; color: #555; border: 1px solid #ddd; cursor: pointer; font-weight: 600; white-space: nowrap; }
.po-select-toggle.active { background: #EFF6FF; color: #007AFF; border-color: #007AFF; }
.page-thumbnails { display: flex; flex-direction: column; gap: 5px; }

.page-thumbnail { display: flex; align-items: flex-start; gap: 5px; padding: 6px; background: #f8f8fa; border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s; border: 2px solid transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
.page-thumbnail.selected { background: #EDF5FF; border-color: #007AFF44; }
.page-thumbnail.thumb-active { border-color: #007AFF; }
.page-thumbnail.dragging { opacity: 0.3; }
.page-thumbnail.drag-over-top { border-top: 3px solid #007AFF; }
.page-thumbnail.drag-over-bottom { border-bottom: 3px solid #007AFF; }

/* Checkbox nur sichtbar im Auswahl-Modus */
.page-thumb-checkbox { margin-top: 2px; flex-shrink: 0; accent-color: #007AFF; width: 14px; height: 14px; display: none; }
.selection-mode .page-thumb-checkbox { display: block; }

.page-thumb-content { flex: 1; min-width: 0; }
.page-thumb-img { width: 100%; height: 58px; object-fit: cover; border-radius: 4px; margin-bottom: 3px; background: #ddd; pointer-events: none; display: block; }
.page-thumb-info { font-size: 9px; color: #555; font-weight: 600; display: flex; align-items: center; gap: 3px; }
.page-thumb-num { display: inline-flex; align-items: center; justify-content: center; background: #007AFF; color: white; width: 15px; height: 15px; border-radius: 50%; font-size: 8px; font-weight: 800; flex-shrink: 0; }
.page-thumb-num.no-pagenum { background: #bbb; }
.page-thumb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page-thumb-count { font-size: 8px; color: #aaa; margin-top: 1px; }

.drag-ghost { position: fixed; pointer-events: none; z-index: 9999; opacity: 0.88; background: white; border-radius: 9px; box-shadow: 0 8px 28px rgba(0,0,0,0.22); padding: 7px; width: 160px; transform: rotate(2.5deg) scale(1.04); transition: none; }

/* === TEXT MODAL === */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(3px); }
.modal-overlay.active { display: flex; }
.modal { background: white; border-radius: 16px; padding: 20px; min-width: 300px; max-width: 90vw; box-shadow: 0 16px 48px rgba(0,0,0,0.18); }
.modal h3 { margin-bottom: 14px; color: #1a1a1a; font-size: 15px; }
.modal input { width: 100%; padding: 11px; border: 2px solid #e5e5e7; border-radius: 8px; font-size: 16px; margin-bottom: 14px; outline: none; font-family: inherit; }
.modal input:focus { border-color: #007AFF; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

.portrait-toggle { display: none; }

@media (max-width: 1100px) {
  .toolbar { width: 200px; padding: 9px 7px; }
  .icon-btn { min-height: 48px; }
  .icon-btn svg { width: 36px; height: 23px; }
}
@media (max-width: 850px) {
  .portrait-toggle { display: flex !important; }
  .page-overview {
    display: none;
  }
  .page-overview.po-open {
    display: flex !important;
    position: fixed;
    right: 0; top: 54px; bottom: 0;
    z-index: 500;
    box-shadow: -4px 0 20px rgba(0,0,0,0.14);
    width: 210px;
    padding: 12px 9px;
    overflow-y: auto;
  }
}
@media (max-width: 700px) {
  .main-container { flex-direction: column; }
  .toolbar { width: 100% !important; max-height: 180px; border-right: none; border-bottom: 1px solid #e8e8ea; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px; gap: 8px; }
  .tool-section { min-width: 120px; flex-shrink: 0; }
  .page-overview { display: none !important; }
  .header-address { max-width: none; }
}
@supports (-webkit-touch-callout: none) {
  canvas { touch-action: none !important; }
}
/* ===== MODUL 1: STYLES (CSS) — END ===== */
</style>
</head>
<body>
<!-- ===== MODUL 2: HTML-LAYOUT — START ===== -->

<!-- Element-Löschen-Button (HTML-Overlay über Canvas) -->
<button id="elemDeleteBtn" onclick="deleteSelectedElement()" title="Element löschen">×</button>

<header class="header">
  <div class="header-title">
    <span style="font-size:19px;">🌐</span>
    <span>Glasfaser v6.0</span>
  </div>
  <div class="header-address">
    <input type="text" id="addressInput" placeholder="📍 Anschrift (optional)" autocomplete="off">
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost portrait-toggle" id="toggleOverview" onclick="togglePageOverview()" title="Seitenübersicht">☰</button>
    <input type="file" id="imageUpload" multiple accept="image/*,application/json" style="display:none;">
    <button class="btn btn-primary" onclick="document.getElementById('imageUpload').click()">📸 Hochladen</button>
    <button class="btn btn-success" onclick="exportSelectedAsZip()">📥 ZIP</button>
    <button class="btn btn-danger" onclick="clearAllImages()">🗑️</button>
  </div>
</header>

<div id="statusBar"></div>

<div class="drawing-banner" id="drawingBanner">
  <span id="drawingBannerText">✏️ Pencil-Modus</span>
  <button onclick="undoPencilPoint()" id="pencilUndoBtn">↶ Punkt</button>
  <button onclick="finishDrawing()">✓ Fertig</button>
  <button onclick="cancelDrawing()">✕</button>
</div>

<div class="modal-overlay" id="textModal">
  <div class="modal">
    <h3>📝 Eigenen Text eingeben</h3>
    <input type="text" id="customTextInput" placeholder="Text eingeben..." autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeTextModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="addCustomText()">Hinzufügen</button>
    </div>
  </div>
</div>

<div class="main-container">
  <!-- LEFT TOOLBAR -->
  <aside class="toolbar" id="toolbar">

    <!-- AUSWAHL-WERKZEUG -->
    <div class="tool-section">
      <button class="select-tool-btn" id="selectToolBtn" onclick="toggleSelectTool()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-7 1-4 6z"/></svg>
        Auswahl
      </button>
    </div>

    <!-- LINIEN -->
    <div class="tool-section">
      <div class="tool-section-title">Linien</div>
      <div class="tool-grid-2">
        <button class="icon-btn" onclick="addElementToActive('line_blue')" title="Blaue Linie">
          <svg viewBox="0 0 40 22" fill="none"><line x1="4" y1="18" x2="36" y2="4" stroke="#0066FF" stroke-width="3.5" stroke-linecap="round"/></svg>
          <span class="icon-label">Blau</span>
        </button>
        <button class="icon-btn" onclick="addElementToActive('line_purple')" title="Lila Linie">
          <svg viewBox="0 0 40 22" fill="none"><line x1="4" y1="18" x2="36" y2="4" stroke="#9333EA" stroke-width="3.5" stroke-linecap="round"/></svg>
          <span class="icon-label">Lila</span>
        </button>
        <button class="icon-btn" onclick="addElementToActive('line_blue_yellow')" title="Blaue Linie + Gelber Kreis">
          <svg viewBox="0 0 44 24" fill="none"><line x1="3" y1="20" x2="29" y2="7" stroke="#0066FF" stroke-width="3" stroke-linecap="round"/><circle cx="37" cy="7" r="6.5" stroke="#FFD700" stroke-width="2.5"/></svg>
          <span class="icon-label">Blau + 🟡</span>
        </button>
        <button class="icon-btn" onclick="addElementToActive('line_blue_red')" title="Blaue Linie + Roter Kreis">
          <svg viewBox="0 0 44 24" fill="none"><line x1="3" y1="20" x2="29" y2="7" stroke="#0066FF" stroke-width="3" stroke-linecap="round"/><circle cx="37" cy="7" r="6.5" stroke="#FF3030" stroke-width="2.5"/></svg>
          <span class="icon-label">Blau + 🔴</span>
        </button>
        <button class="icon-btn" onclick="addElementToActive('line_purple_yellow')" title="Lila Linie + Gelber Kreis">
          <svg viewBox="0 0 44 24" fill="none"><line x1="3" y1="20" x2="29" y2="7" stroke="#9333EA" stroke-width="3" stroke-linecap="round"/><circle cx="37" cy="7" r="6.5" stroke="#FFD700" stroke-width="2.5"/></svg>
          <span class="icon-label">Lila + 🟡</span>
        </button>
        <button class="icon-btn" onclick="addElementToActive('line_purple_red')" title="Lila Linie + Roter Kreis">
          <svg viewBox="0 0 44 24" fill="none"><line x1="3" y1="20" x2="29" y2="7" stroke="#9333EA" stroke-width="3" stroke-linecap="round"/><circle cx="37" cy="7" r="6.5" stroke="#FF3030" stroke-width="2.5"/></svg>
          <span class="icon-label">Lila + 🔴</span>
        </button>
      </div>
    </div>

    <!-- ZICKZACK -->
    <div class="tool-section">
      <div class="tool-section-title">Zickzack-Linie</div>
      <div class="tool-grid-2">
        <button class="icon-btn" id="pencil-btn-blue" onclick="startPencilDraw('blue')" title="Zickzack Blau">
          <svg viewBox="0 0 44 26" fill="none"><polyline points="3,22 12,6 20,18 30,6 40,18" stroke="#0066FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="icon-label">✏️ Blau</span>
        </button>
        <button class="icon-btn" id="pencil-btn-purple" onclick="startPencilDraw('purple')" title="Zickzack Lila">
          <svg viewBox="0 0 44 26" fill="none"><polyline points="3,22 12,6 20,18 30,6 40,18" stroke="#9333EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="icon-label">✏️ Lila</span>
        </button>
      </div>
    </div>

    <!-- KREISE -->
    <div class="tool-section">
      <div class="tool-section-title">Kreise (transparent)</div>
      <div class="tool-grid-2">
        <button class="icon-btn" onclick="addElementToActive('circle_yellow')">
          <svg viewBox="0 0 40 28" fill="none"><circle cx="20" cy="14" r="10" stroke="#FFD700" stroke-width="3"/></svg>
          <span class="icon-label">🟡 Kreis</span>
        </button>
        <button class="icon-btn" onclick="addElementToActive('circle_red')">
          <svg viewBox="0 0 40 28" fill="none"><circle cx="20" cy="14" r="10" stroke="#FF3030" stroke-width="3"/></svg>
          <span class="icon-label">🔴 Kreis</span>
        </button>
      </div>
    </div>

    <!-- RECHTECKE -->

<!-- ===== MODUL 2: HTML-LAYOUT — END ===== -->
<script>
// ===== MODUL 3: KONFIGURATION — START =====
let images = [];
let activeImageId = null;
let selectedElement = { imageId: null, index: -1 };
let isDragging = false;
let isResizingEndpoint = null;
let dragStartPos = { x: 0, y: 0 };
let zoomLevels = {};

// Auswahl-Werkzeug
let selectToolActive = false;

// Übersicht Auswahl-Modus
let overviewSelectMode = false;

// PENCIL MODE
let pencilMode = null;
let snapGuides = [];

// PINCH ZOOM
let activePointers = new Map();
let pinchState = null;

// DRAG & DROP Thumbnails
let thumbDragState = { active: false, imageId: null, ghost: null, overImageId: null, overBefore: false };
let thumbDragCleanup = null;

// Debounce-Timer für renderPageOverview
let _poTimer = null;

// Splitter Standardgröße: 150% von 80 = 120
const SPLITTER_SIZE = 120;
// ===== MODUL 3: KONFIGURATION — END =====

// ===== MODUL 10: BILD-VERWALTUNG — START (Abschnitt: Upload) =====
document.getElementById('imageUpload').addEventListener('change', handleImageUpload);

// Reihenfolge der Datei-Auswahl beibehalten: sequenzielles Laden
async function handleImageUpload(e) {
  const files = Array.from(e.target.files);
  const imageFiles = files.filter(f => f.type.startsWith('image/'));
  const jsonFiles  = files.filter(f => f.type === 'application/json' || f.name.endsWith('.json'));

  if (imageFiles.length > 0) {
    showStatus(`⏳ ${imageFiles.length} Bild${imageFiles.length > 1 ? 'er' : ''} wird geladen…`, 'info');
    for (const file of imageFiles) {
      await loadSingleImage(file);
    }
    renderAllImages();
    renderPageOverview();
    showStatus(`✅ ${imageFiles.length} Bild${imageFiles.length > 1 ? 'er' : ''} hinzugefügt`, 'success');
  }

  for (const file of jsonFiles) {
    await loadJsonFile(file);
  }

  document.getElementById('imageUpload').value = '';
}

function loadSingleImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const autoNumber = images.length + 1;
        // Erste 3 Bilder ohne Seitennummer, ab Bild 4 mit Nummer
        const showPageNumber = autoNumber >= 4;
        const imageData = {
          id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          name: file.name,
          image: img,
          imageDataUrl: ev.target.result,
          elements: [],
          history: [],
          eraserMode: false,
          selected: true,
          autoNumber,
          showPageNumber
        };
        images.push(imageData);
        if (showPageNumber) addAutoNumberElement(imageData);
        updateAllNumbers();
        resolve();
      };
      img.onerror = () => resolve();
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function loadJsonFile(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        loadProjectFromJSON(JSON.parse(ev.target.result));
      } catch (err) {
        showStatus(`❌ JSON-Fehler: ${err.message}`, 'error');
      }
      resolve();
    };
    reader.readAsText(file);
  });
}

function loadProjectFromJSON(data) {
  const target = images.find(img => img.name === data.name);
  if (target) {
    pushHistory(target);
    target.elements = data.elements || [];
    renderAllImages();
    renderPageOverview();
    showStatus(`✅ Projekt "${data.name}" geladen`, 'success');
  } else {
    showStatus(`⚠️ Bild "${data.name}" nicht gefunden`, 'error');
  }
}

function updateAllNumbers() {
  images.forEach((img, idx) => { img.autoNumber = idx + 1; });
  updateAutoNumberElements();
}

function addAutoNumberElement(img) {
  const fontSize = Math.max(28, Math.min(60, img.image.width / 35));
  img.elements.push({
    type: 'text',
    text: String(img.autoNumber),
    x: Math.round(img.image.width / 2 - fontSize * 0.3),
    y: Math.round(img.image.height - fontSize * 2.5),
    color: '#FFD700',
    fontSize,
    isAutoNumber: true
  });
}

function updateAutoNumberElements() {
  images.forEach(img => {
    const el = img.elements.find(e => e.isAutoNumber);
    if (el) {
      el.text = String(img.autoNumber);
      redrawImage(img);
    }
  });
}

// Seitennummer pro Bild ein-/ausschalten
function togglePageNumber(imageId) {
  const img = images.find(i => i.id === imageId);
  if (!img) return;
  pushHistory(img);
  img.showPageNumber = !img.showPageNumber;
  if (img.showPageNumber) {
    // Seitennummer wieder hinzufügen
    if (!img.elements.find(e => e.isAutoNumber)) {
      addAutoNumberElement(img);
    }
  } else {
    // Seitennummer entfernen
    img.elements = img.elements.filter(e => !e.isAutoNumber);
  }
  redrawImage(img);
  updatePageNumberBadge(img);
}

function updatePageNumberBadge(img) {
  const badge = document.querySelector(`[data-image-id="${img.id}"].image-card .image-number-badge`);
  const btn   = document.getElementById(`pnbtn-${img.id}`);
  if (badge) badge.className = 'image-number-badge' + (img.showPageNumber ? '' : ' no-pagenum');
  if (btn)   { btn.textContent = img.showPageNumber ? '# Seite' : '# —'; btn.classList.toggle('pagenum-off', !img.showPageNumber); }
  renderPageOverviewDebounced();
}
// ===== MODUL 10: BILD-VERWALTUNG — END (Abschnitt: Upload) =====

// ===== MODUL 4: ELEMENT-DEFINITIONEN — START =====
function createElementByType(type, canvasWidth, canvasHeight) {
  const cx = canvasWidth / 2;
  const cy = canvasHeight / 2;
  const lineWidth = Math.max(4, canvasWidth / 350);
  const lineLength = Math.max(120, canvasWidth / 5);
  const lineStartX = 80;
  const lineStartY = 80;
  const circleRadius = Math.max(20, canvasWidth / 75);

  const templates = {
    'line_blue':   { type:'line', x1:lineStartX, y1:lineStartY, x2:lineStartX+lineLength, y2:lineStartY+lineLength, color:'#0066FF', lineWidth },
    'line_purple': { type:'line', x1:lineStartX, y1:lineStartY, x2:lineStartX+lineLength, y2:lineStartY+lineLength, color:'#9333EA', lineWidth },
    'line_blue_yellow':   { type:'line_circle', x1:lineStartX, y1:lineStartY, x2:lineStartX+lineLength, y2:lineStartY+lineLength, color:'#0066FF', circleColor:'#FFD700', circleRadius, lineWidth },
    'line_blue_red':      { type:'line_circle', x1:lineStartX, y1:lineStartY, x2:lineStartX+lineLength, y2:lineStartY+lineLength, color:'#0066FF', circleColor:'#FF3030', circleRadius, lineWidth },
    'line_purple_yellow': { type:'line_circle', x1:lineStartX, y1:lineStartY, x2:lineStartX+lineLength, y2:lineStartY+lineLength, color:'#9333EA', circleColor:'#FFD700', circleRadius, lineWidth },
    'line_purple_red':    { type:'line_circle', x1:lineStartX, y1:lineStartY, x2:lineStartX+lineLength, y2:lineStartY+lineLength, color:'#9333EA', circleColor:'#FF3030', circleRadius, lineWidth },
    'circle_yellow': { type:'circle', x:cx, y:cy, radius:Math.max(25,canvasWidth/70), color:'#FFD700', lineWidth },
    'circle_red':    { type:'circle', x:cx, y:cy, radius:Math.max(25,canvasWidth/70), color:'#FF3030', lineWidth },
    // Splitter: Standardgröße 150% (120×120)
    'rect_large_yellow': { type:'rect', x:cx-SPLITTER_SIZE/2, y:cy-SPLITTER_SIZE/2, width:SPLITTER_SIZE, height:SPLITTER_SIZE, color:'#FFD700', lineWidth },
    // GFTA: zwei separate Rechtecke
    'gfta_horizontal': { type:'gfta', x1:cx-45, y1:cy-20, width:38, height:38, spacing:12, color:'#FF3030', lineWidth, rotation:0 },
    'gfta_vertical':   { type:'gfta', x1:cx-20, y1:cy-45, width:38, height:38, spacing:12, color:'#FF3030', lineWidth, rotation:90 }
  };

  const fontSize = Math.max(22, canvasWidth / 50);
  const numberFontSize = Math.max(32, canvasWidth / 35);
  const labels = [
    ['text_zu_eg','Zu EG'],['text_zu_1og','Zu 1.OG'],['text_zu_2og','Zu 2.OG'],
    ['text_zu_treppe','Zum Treppenhaus'],['text_linke_kamine','Linke Kamine'],
    ['text_rechte_kamine','Rechte Kamine'],['text_zu_linke_kamine','Zu linke Kamine'],
    ['text_zu_rechte_kamine','Zu rechte Kamine'],['text_baugleich','Baugleich']
  ];
  labels.forEach(([id,text]) => { templates[id] = { type:'text', text, x:canvasWidth-260, y:50, color:'#FFD700', fontSize }; });
  for (let i=1; i<=12; i++) {
    templates[`text_number_${i}`] = { type:'text', text:String(i), x:cx-15, y:canvasHeight-80, color:'#FFD700', fontSize:numberFontSize };
  }

  return templates[type] ? { ...templates[type] } : null;
}

function addElementToActive(type) {
  // Eraser deaktivieren wenn Drawing-Tool gewählt
  deactivateAllErasers();
  // Auswahl-Tool deaktivieren
  if (selectToolActive) { selectToolActive = false; document.getElementById('selectToolBtn').classList.remove('active'); }
  hideDeleteOverlay();
  deselectElement();

  if (!activeImageId) {
    if (images.length > 0) activeImageId = images[0].id;
    else { showStatus('⚠️ Zuerst Bild hochladen', 'error'); return; }
  }
  const img = images.find(i => i.id === activeImageId);
  if (!img) return;
  const elem = createElementByType(type, img.image.width, img.image.height);
  if (elem) {
    pushHistory(img);
    img.elements.push(elem);
    selectedElement = { imageId: img.id, index: img.elements.length - 1 };
    redrawImage(img);
    renderPageOverviewDebounced();
  }
}

function pushHistory(img) {
  img.history.push(JSON.parse(JSON.stringify(img.elements)));
  if (img.history.length > 60) img.history.shift();
}

// TEXT MODAL
function openTextModal() {
  if (!activeImageId) {
    if (images.length > 0) activeImageId = images[0].id;
    else { showStatus('⚠️ Zuerst Bild hochladen', 'error'); return; }
  }
  document.getElementById('textModal').classList.add('active');
  setTimeout(() => document.getElementById('customTextInput').focus(), 100);
}
function closeTextModal() {
  document.getElementById('textModal').classList.remove('active');
  document.getElementById('customTextInput').value = '';
}
function addCustomText() {
  const text = document.getElementById('customTextInput').value.trim();
  if (!text) return;
  const img = images.find(i => i.id === activeImageId);
  if (!img) return;
  const fontSize = Math.max(22, img.image.width / 50);
  pushHistory(img);
  img.elements.push({ type:'text', text, x:img.image.width-260, y:50, color:'#FFD700', fontSize });
  selectedElement = { imageId: img.id, index: img.elements.length - 1 };
  redrawImage(img);
  renderPageOverviewDebounced();
  closeTextModal();
  showStatus('✅ Text hinzugefügt', 'success');
}
// ===== MODUL 4: ELEMENT-DEFINITIONEN — END =====

// ===== MODUL 5: CANVAS-RENDERING — START =====
function renderAllImages() {
  const area  = document.getElementById('canvasArea');
  const empty = document.getElementById('emptyState');
  if (images.length === 0) {
    area.innerHTML = '';
    area.appendChild(empty);
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';
  // Nur neue/veränderte Cards hinzufügen, bestehende wiederverwenden
  const existingIds = new Set([...area.querySelectorAll('.image-card')].map(c => c.dataset.imageId));
  const newIds = new Set(images.map(i => i.id));

  // Entfernen was nicht mehr da ist
  area.querySelectorAll('.image-card').forEach(c => {
    if (!newIds.has(c.dataset.imageId)) c.remove();
  });

  // Reihenfolge anpassen + neue hinzufügen
  images.forEach((img, idx) => {
    let card = area.querySelector(`.image-card[data-image-id="${img.id}"]`);
    if (!card) {
      card = createImageCard(img, idx);
      area.appendChild(card);
    }
    // Reihenfolge sicherstellen
    const cards = [...area.querySelectorAll('.image-card')];
    if (cards[idx] !== card) area.appendChild(card);
    // Badge + Nummer aktualisieren
    const badge = card.querySelector('.image-number-badge');
    if (badge) { badge.textContent = img.autoNumber; badge.className = 'image-number-badge' + (img.showPageNumber ? '' : ' no-pagenum'); }
    card.classList.toggle('active-image', img.id === activeImageId);
    setTimeout(() => redrawImage(img), 0);
  });
}

function createImageCard(img, index) {
  if (!zoomLevels[img.id]) zoomLevels[img.id] = 1.0;
  const card = document.createElement('div');
  card.className = 'image-card' + (img.id === activeImageId ? ' active-image' : '');
  card.dataset.imageId = img.id;

  card.innerHTML = `
    <div class="image-card-header">
      <div class="image-card-title">
        <div class="image-number-badge${img.showPageNumber ? '' : ' no-pagenum'}">${img.autoNumber}</div>
        <span class="image-name-text">${img.name}</span>
      </div>
      <div class="image-card-actions">
        <button class="card-btn${img.showPageNumber ? '' : ' pagenum-off'}" id="pnbtn-${img.id}" onclick="togglePageNumber('${img.id}')" title="Seitennummer ein/ausschalten">${img.showPageNumber ? '# Seite' : '# —'}</button>
        <button class="card-btn ${img.eraserMode ? 'eraser-active' : ''}" id="eraser-${img.id}" onclick="toggleEraser('${img.id}')">🧹 Radierer</button>
        <button class="card-btn" onclick="undoLast('${img.id}')">↶ Undo</button>
        <button class="card-btn" onclick="saveImage('${img.id}')">💾</button>
        <button class="card-btn danger" onclick="deleteImage('${img.id}')">✕</button>
      </div>
    </div>
    <div class="image-card-canvas-wrapper" id="wrapper-${img.id}" onclick="setActiveImage('${img.id}')">
      <canvas id="canvas-${img.id}"></canvas>
    </div>
    <div class="image-card-footer">
      <span id="counter-${img.id}">${img.elements.length} Element${img.elements.length !== 1 ? 'e' : ''}</span>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="event.stopPropagation();zoomImage('${img.id}', -0.25)">−</button>
        <span class="zoom-level" id="zoom-${img.id}">${Math.round(zoomLevels[img.id]*100)}%</span>
        <button class="zoom-btn" onclick="event.stopPropagation();zoomImage('${img.id}', 0.25)">+</button>
        <button class="zoom-btn" style="font-size:11px;" onclick="event.stopPropagation();resetZoom('${img.id}')">⟲</button>
      </div>
      <span>${img.image.width}×${img.image.height}</span>
    </div>
  `;

  const canvas = card.querySelector('canvas');
  setupCanvas(canvas, img);
  return card;
}

function setActiveImage(imageId) {
  activeImageId = imageId;
  document.querySelectorAll('.image-card').forEach(c => {
    c.classList.toggle('active-image', c.dataset.imageId === imageId);
  });
}

function zoomImage(imageId, delta) {
  const current = zoomLevels[imageId] || 1.0;
  zoomLevels[imageId] = Math.max(0.2, Math.min(4.0, current + delta));
  applyZoom(imageId);
}
function resetZoom(imageId) { zoomLevels[imageId] = 1.0; applyZoom(imageId); }
function applyZoom(imageId) {
  const img = images.find(i => i.id === imageId);
  if (!img) return;
  const canvas = document.getElementById(`canvas-${imageId}`);
  if (!canvas) return;
  const zoom = zoomLevels[imageId];
  const maxDisplayWidth = 900;
  const aspectRatio = img.image.height / img.image.width;
  const baseWidth = Math.min(maxDisplayWidth, img.image.width);
  canvas.style.width  = (baseWidth * zoom) + 'px';
  canvas.style.height = (baseWidth * zoom * aspectRatio) + 'px';
  const zoomEl = document.getElementById(`zoom-${imageId}`);
  if (zoomEl) zoomEl.textContent = Math.round(zoom * 100) + '%';
  updateDeleteOverlayPosition();
}

function setupCanvas(canvas, img) {
  canvas.width  = img.image.width;
  canvas.height = img.image.height;
  const maxDisplayWidth = 900;
  const aspectRatio = img.image.height / img.image.width;
  const displayWidth = Math.min(maxDisplayWidth, img.image.width);
  const zoom = zoomLevels[img.id] || 1.0;
  canvas.style.width  = (displayWidth * zoom) + 'px';
  canvas.style.height = (displayWidth * zoom * aspectRatio) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  if (img.eraserMode) canvas.classList.add('eraser-mode');
  if (selectToolActive) canvas.classList.add('select-mode');
  canvas.addEventListener('pointerdown', (e) => handlePointerDown(e, img, canvas));
  canvas.addEventListener('pointermove', (e) => handlePointerMove(e, img, canvas));
  canvas.addEventListener('pointerup',   (e) => handlePointerUp(e, img, canvas));
  canvas.addEventListener('pointercancel',(e) => handlePointerUp(e, img, canvas));
  canvas.addEventListener('dblclick', (e) => handleDoubleClick(e, img, canvas));
  canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchmove',  (e) => e.preventDefault(), { passive: false });
}

// Debounced renderPageOverview – verhindert zu viele DOM-Updates
function renderPageOverviewDebounced() {
  clearTimeout(_poTimer);
  _poTimer = setTimeout(() => renderPageOverview(), 80);
}

let _rafPending = {};
function redrawImage(img) {
  if (_rafPending[img.id]) return;
  _rafPending[img.id] = true;
  requestAnimationFrame(() => {
    _rafPending[img.id] = false;
    const canvas = document.getElementById(`canvas-${img.id}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img.image, 0, 0);
    if (snapGuides.length > 0 && pencilMode && pencilMode.imageId === img.id) drawSnapGuides(ctx, img);
    img.elements.forEach((elem, idx) => {
      const isSel = selectedElement.imageId === img.id && selectedElement.index === idx;
      drawElement(ctx, elem, isSel);
    });
    if (pencilMode && pencilMode.imageId === img.id && pencilMode.points.length > 0) drawPencilPreview(ctx, pencilMode);
  });
}

function drawSnapGuides(ctx, img) {
  ctx.save(); ctx.strokeStyle = '#FF00FF'; ctx.lineWidth = 1; ctx.setLineDash([5,5]);
  snapGuides.forEach(g => { ctx.beginPath(); if (g.type==='horizontal') { ctx.moveTo(0,g.y); ctx.lineTo(img.image.width,g.y); } else { ctx.moveTo(g.x,0); ctx.lineTo(g.x,img.image.height); } ctx.stroke(); });
  ctx.restore();
}

function drawPencilPreview(ctx, mode) {
  if (mode.points.length === 0) return;
  const color = mode.color === 'blue' ? '#0066FF' : '#9333EA';
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(mode.points[0].x, mode.points[0].y);
  for (let i=1; i<mode.points.length; i++) ctx.lineTo(mode.points[i].x, mode.points[i].y);
  if (mode.currentPos) ctx.lineTo(mode.currentPos.x, mode.currentPos.y);
  ctx.stroke();
  ctx.fillStyle = color;
  mode.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,6,0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}

function drawElement(ctx, elem, isSelected) {
  switch (elem.type) {
    case 'line':      drawLine(ctx, elem, isSelected); break;
    case 'line_circle': drawLineCircle(ctx, elem, isSelected); break;
    case 'polyline':  drawPolyline(ctx, elem, isSelected); break;
    case 'circle':    drawCircleEl(ctx, elem, isSelected); break;
    case 'rect':      drawRect(ctx, elem, isSelected); break;
    case 'gfta':      drawGFTA(ctx, elem, isSelected); break;
    case 'text':      drawText(ctx, elem, isSelected); break;
  }
}

function drawLine(ctx, elem, isSelected) {
  ctx.save(); ctx.strokeStyle = elem.color; ctx.lineWidth = elem.lineWidth; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(elem.x1,elem.y1); ctx.lineTo(elem.x2,elem.y2); ctx.stroke();
  if (isSelected) { drawEndpointHandle(ctx,elem.x1,elem.y1,'#34C759'); drawEndpointHandle(ctx,elem.x2,elem.y2,'#007AFF'); }
  ctx.restore();
}

function drawLineCircle(ctx, elem, isSelected) {
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = elem.color; ctx.lineWidth = elem.lineWidth;
  ctx.beginPath(); ctx.moveTo(elem.x1,elem.y1); ctx.lineTo(elem.x2,elem.y2); ctx.stroke();
  ctx.strokeStyle = elem.circleColor; ctx.lineWidth = elem.lineWidth;
  ctx.beginPath(); ctx.arc(elem.x2,elem.y2,elem.circleRadius,0,Math.PI*2); ctx.stroke();
  if (isSelected) { drawEndpointHandle(ctx,elem.x1,elem.y1,'#34C759'); drawEndpointHandle(ctx,elem.x2,elem.y2,'#007AFF'); }
  ctx.restore();
}

function drawPolyline(ctx, elem, isSelected) {
  if (!elem.points || elem.points.length < 2) return;
  ctx.save(); ctx.strokeStyle = elem.color; ctx.lineWidth = elem.lineWidth; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(elem.points[0].x,elem.points[0].y);
  for (let i=1; i<elem.points.length; i++) ctx.lineTo(elem.points[i].x,elem.points[i].y);
  ctx.stroke();
  if (isSelected) {
    ctx.fillStyle = '#007AFF'; ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
    elem.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
  }
  ctx.restore();
}

function drawCircleEl(ctx, elem, isSelected) {
  ctx.save(); ctx.strokeStyle = elem.color; ctx.lineWidth = elem.lineWidth;
  ctx.beginPath(); ctx.arc(elem.x,elem.y,elem.radius,0,Math.PI*2); ctx.stroke();
  if (isSelected) {
    ctx.strokeStyle = '#007AFF'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.strokeRect(elem.x-elem.radius-8, elem.y-elem.radius-8, elem.radius*2+16, elem.radius*2+16);
    ctx.setLineDash([]); drawEndpointHandle(ctx, elem.x+elem.radius, elem.y, '#007AFF');
  }
  ctx.restore();
}

function drawRect(ctx, elem, isSelected) {
  ctx.save(); ctx.strokeStyle = elem.color; ctx.lineWidth = elem.lineWidth;
  ctx.strokeRect(elem.x, elem.y, elem.width, elem.height);
  if (isSelected) {
    ctx.strokeStyle = '#007AFF'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.strokeRect(elem.x-8, elem.y-8, elem.width+16, elem.height+16);
    ctx.setLineDash([]); drawEndpointHandle(ctx, elem.x+elem.width, elem.y+elem.height, '#007AFF');
  }
  ctx.restore();
}

function drawGFTA(ctx, elem, isSelected) {
  ctx.save(); ctx.strokeStyle = elem.color; ctx.lineWidth = elem.lineWidth;
  const rot = elem.rotation || 0;
  let totalW, totalH;
  // Zwei wirklich getrennte Rechtecke mit Abstand (spacing)
  if (rot === 0) {
    ctx.strokeRect(elem.x1, elem.y1, elem.width, elem.height);
    ctx.strokeRect(elem.x1 + elem.width + elem.spacing, elem.y1, elem.width, elem.height);
    totalW = elem.width*2 + elem.spacing; totalH = elem.height;
  } else {
    ctx.strokeRect(elem.x1, elem.y1, elem.width, elem.height);
    ctx.strokeRect(elem.x1, elem.y1 + elem.height + elem.spacing, elem.width, elem.height);
    totalW = elem.width; totalH = elem.height*2 + elem.spacing;
  }
  if (isSelected) {
    ctx.strokeStyle = '#007AFF'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.strokeRect(elem.x1-8, elem.y1-8, totalW+16, totalH+16);
    ctx.setLineDash([]); drawEndpointHandle(ctx, elem.x1+totalW, elem.y1+totalH, '#007AFF');
  }
  ctx.restore();
}

function drawText(ctx, elem, isSelected) {
  ctx.save();
  ctx.font = `900 ${elem.fontSize}px -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif`;
  const textWidth = ctx.measureText(elem.text).width;
  const padding = 8;
  const bgX = elem.x - padding, bgY = elem.y;
  const bgW = textWidth + padding*2, bgH = elem.fontSize + padding*2;
  ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fillRect(bgX,bgY,bgW,bgH);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5; ctx.strokeRect(bgX,bgY,bgW,bgH);
  ctx.fillStyle = elem.color; ctx.textBaseline = 'top'; ctx.fillText(elem.text, elem.x, elem.y+padding);
  if (isSelected) {
    ctx.strokeStyle = '#007AFF'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.strokeRect(bgX-4, bgY-4, bgW+8, bgH+8); ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawEndpointHandle(ctx, x, y, color) {
  ctx.fillStyle = color; ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x,y,11,0,Math.PI*2); ctx.fill(); ctx.stroke();
}
// ===== MODUL 5: CANVAS-RENDERING — END =====

// ===== MODUL 6: TOUCH/PENCIL-EVENTS — START (Abschnitt: Hit Detection) =====
function getPointerPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
}

function getElementAtPoint(img, x, y) {
  const buffer = 18;
  for (let i = img.elements.length-1; i >= 0; i--) {
    const elem = img.elements[i];
    switch (elem.type) {
      case 'line':
        if (Math.hypot(x-elem.x1,y-elem.y1) < 22) return { index:i, part:'start' };
        if (Math.hypot(x-elem.x2,y-elem.y2) < 22) return { index:i, part:'end' };
        if (pointToLineDistance(x,y,elem.x1,elem.y1,elem.x2,elem.y2) < buffer && isPointWithinLineSegment(x,y,elem.x1,elem.y1,elem.x2,elem.y2)) return { index:i, part:'body' };
        break;
      case 'line_circle':
        if (Math.hypot(x-elem.x1,y-elem.y1) < 22) return { index:i, part:'start' };
        if (Math.hypot(x-elem.x2,y-elem.y2) < 22) return { index:i, part:'end' };
        if (Math.hypot(x-elem.x2,y-elem.y2) <= elem.circleRadius+buffer) return { index:i, part:'body' };
        if (pointToLineDistance(x,y,elem.x1,elem.y1,elem.x2,elem.y2) < buffer && isPointWithinLineSegment(x,y,elem.x1,elem.y1,elem.x2,elem.y2)) return { index:i, part:'body' };
        break;
      case 'polyline':
        if (!elem.points) break;
        for (let p=0; p<elem.points.length; p++) {
          if (Math.hypot(x-elem.points[p].x, y-elem.points[p].y) < 20) return { index:i, part:`point_${p}` };
        }
        for (let p=0; p<elem.points.length-1; p++) {
          const p1=elem.points[p], p2=elem.points[p+1];
          if (pointToLineDistance(x,y,p1.x,p1.y,p2.x,p2.y) < buffer && isPointWithinLineSegment(x,y,p1.x,p1.y,p2.x,p2.y)) return { index:i, part:`seg_${p}` };
        }
        break;
      case 'circle':
        if (Math.hypot(x-(elem.x+elem.radius), y-elem.y) < 16) return { index:i, part:'resize' };
        if (Math.hypot(x-elem.x, y-elem.y) <= elem.radius+buffer) return { index:i, part:'body' };
        break;
      case 'rect':
        if (Math.hypot(x-(elem.x+elem.width), y-(elem.y+elem.height)) < 16) return { index:i, part:'resize' };
        if (x>=elem.x-buffer && x<=elem.x+elem.width+buffer && y>=elem.y-buffer && y<=elem.y+elem.height+buffer) return { index:i, part:'body' };
        break;
      case 'gfta': {
        const rot = elem.rotation||0;
        const tw = rot===0 ? elem.width*2+elem.spacing : elem.width;
        const th = rot===0 ? elem.height : elem.height*2+elem.spacing;
        if (Math.hypot(x-(elem.x1+tw), y-(elem.y1+th)) < 16) return { index:i, part:'resize' };
        if (x>=elem.x1-buffer && x<=elem.x1+tw+buffer && y>=elem.y1-buffer && y<=elem.y1+th+buffer) return { index:i, part:'body' };
        break;
      }
      case 'text': {
        const cv = document.getElementById(`canvas-${img.id}`);
        if (!cv) break;
        const c2 = cv.getContext('2d');
        c2.font = `900 ${elem.fontSize}px -apple-system, Arial, sans-serif`;
        const tw2 = c2.measureText(elem.text).width;
        if (x>=elem.x-12 && x<=elem.x+tw2+12 && y>=elem.y && y<=elem.y+elem.fontSize+20) return { index:i, part:'body' };
        break;
      }
    }
  }
  return null;
}

function pointToLineDistance(px,py,x1,y1,x2,y2) {
  const num = Math.abs((y2-y1)*px-(x2-x1)*py+x2*y1-y2*x1);
  const den = Math.hypot(y2-y1,x2-x1)||1;
  return num/den;
}
function isPointWithinLineSegment(px,py,x1,y1,x2,y2) {
  return px>=Math.min(x1,x2)-10 && px<=Math.max(x1,x2)+10 && py>=Math.min(y1,y2)-10 && py<=Math.max(y1,y2)+10;
}
// ===== MODUL 6: TOUCH/PENCIL-EVENTS — END (Abschnitt: Hit Detection) =====

// ===== MODUL 7: SNAP & HILFSLINIEN — START =====
function findSnapPoint(img, x, y, ignoreIndex) {
  const snapRadius = 35; let nearest = null, minDist = snapRadius;
  img.elements.forEach((elem, idx) => {
    if (idx === ignoreIndex) return;
    let sp = [];
    switch (elem.type) {
      case 'line': sp=[{x:elem.x1,y:elem.y1},{x:elem.x2,y:elem.y2},{x:(elem.x1+elem.x2)/2,y:(elem.y1+elem.y2)/2}]; break;
      case 'line_circle': sp=[{x:elem.x1,y:elem.y1},{x:elem.x2,y:elem.y2},{x:elem.x2+elem.circleRadius,y:elem.y2},{x:elem.x2-elem.circleRadius,y:elem.y2},{x:elem.x2,y:elem.y2+elem.circleRadius},{x:elem.x2,y:elem.y2-elem.circleRadius}]; break;
      case 'polyline': if(elem.points) elem.points.forEach(p=>sp.push({x:p.x,y:p.y})); break;
      case 'circle': sp=[{x:elem.x,y:elem.y},{x:elem.x+elem.radius,y:elem.y},{x:elem.x-elem.radius,y:elem.y},{x:elem.x,y:elem.y+elem.radius},{x:elem.x,y:elem.y-elem.radius}]; break;
      case 'rect': sp=[{x:elem.x,y:elem.y},{x:elem.x+elem.width,y:elem.y},{x:elem.x,y:elem.y+elem.height},{x:elem.x+elem.width,y:elem.y+elem.height},{x:elem.x+elem.width/2,y:elem.y},{x:elem.x+elem.width/2,y:elem.y+elem.height},{x:elem.x,y:elem.y+elem.height/2},{x:elem.x+elem.width,y:elem.y+elem.height/2},{x:elem.x+elem.width/2,y:elem.y+elem.height/2}]; break;
      case 'gfta': {
        const r=elem.rotation||0;
        sp.push({x:elem.x1,y:elem.y1},{x:elem.x1+elem.width,y:elem.y1},{x:elem.x1,y:elem.y1+elem.height},{x:elem.x1+elem.width,y:elem.y1+elem.height});
        if(r===0){const x2g=elem.x1+elem.width+elem.spacing;sp.push({x:x2g,y:elem.y1},{x:x2g+elem.width,y:elem.y1},{x:x2g,y:elem.y1+elem.height},{x:x2g+elem.width,y:elem.y1+elem.height});}
        else{const y2g=elem.y1+elem.height+elem.spacing;sp.push({x:elem.x1,y:y2g},{x:elem.x1+elem.width,y:y2g},{x:elem.x1,y:y2g+elem.height},{x:elem.x1+elem.width,y:y2g+elem.height});}
        break;
      }
    }
    sp.forEach(s => { const d=Math.hypot(x-s.x,y-s.y); if(d<minDist){minDist=d;nearest=s;} });
  });
  return nearest;
}

function getAlignmentSnap(startX, startY, currentX, currentY) {
  const dx=currentX-startX, dy=currentY-startY;
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  const threshold=5;
  let snappedX=currentX, snappedY=currentY, guides=[];
  if(Math.abs(angle-90)<threshold||Math.abs(angle+90)<threshold){snappedX=startX;guides.push({type:'vertical',x:startX});}
  if(Math.abs(angle)<threshold||Math.abs(Math.abs(angle)-180)<threshold){snappedY=startY;guides.push({type:'horizontal',y:startY});}
  if(Math.abs(Math.abs(angle)-45)<threshold||Math.abs(Math.abs(angle)-135)<threshold){
    const len=Math.hypot(dx,dy);const signX=dx>0?1:-1,signY=dy>0?1:-1;
    snappedX=startX+signX*len/Math.sqrt(2);snappedY=startY+signY*len/Math.sqrt(2);
  }
  return {x:snappedX,y:snappedY,guides};
}
// ===== MODUL 7: SNAP & HILFSLINIEN — END =====

// ===== MODUL 6: TOUCH/PENCIL-EVENTS — START (Abschnitt: Pointer Events) =====
function handlePointerDown(e, img, canvas) {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  setActiveImage(img.id);
  activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY, imageId:img.id });
  if (activePointers.size === 2) {
    const pts = [...activePointers.values()];
    pinchState = { dist:Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y), imageId:img.id };
    isDragging = false; return;
  }
  if (pinchState) return;
  const pos = getPointerPos(e, canvas);
  dragStartPos = pos;

  // PENCIL MODE
  if (pencilMode && pencilMode.imageId === img.id) {
    const snap = findSnapPoint(img, pos.x, pos.y, -1);
    let point = snap ? {x:snap.x,y:snap.y} : {x:pos.x,y:pos.y};
    if (pencilMode.points.length > 0 && !snap) {
      const last = pencilMode.points[pencilMode.points.length-1];
      const align = getAlignmentSnap(last.x,last.y,pos.x,pos.y);
      point = {x:align.x,y:align.y};
    }
    pencilMode.pointHistory.push([...pencilMode.points.map(p=>({...p}))]);
    pencilMode.points.push(point);
    updatePencilBanner();
    redrawImage(img);
    return;
  }

  // ERASER MODE
  if (img.eraserMode) {
    const hit = getElementAtPoint(img, pos.x, pos.y);
    if (hit) {
      pushHistory(img);
      img.elements.splice(hit.index, 1);
      if (selectedElement.imageId===img.id && selectedElement.index===hit.index) deselectElement();
      redrawImage(img); updateImageCounter(img); renderPageOverviewDebounced();
      showStatus('🧹 Element gelöscht', 'info');
    }
    return;
  }

  // AUSWAHL: Element antippen → auswählen + × zeigen
  const hit = getElementAtPoint(img, pos.x, pos.y);
  if (hit) {
    // Wenn anderes Bild war selektiert: deselektieren
    if (selectedElement.imageId && selectedElement.imageId !== img.id) {
      const oldImg = images.find(i => i.id === selectedElement.imageId);
      if (oldImg) { selectedElement = {imageId:null,index:-1}; redrawImage(oldImg); }
    }
    selectedElement = { imageId:img.id, index:hit.index };
    isDragging = true;
    isResizingEndpoint = (hit.part==='start'||hit.part==='end'||hit.part==='resize'||hit.part.startsWith('point_')) ? hit.part : null;
    pushHistory(img);
    redrawImage(img);
    // × Button zeigen (immer, nicht nur im Auswahl-Tool)
    showDeleteOverlay(img, hit.index, canvas);
  } else {
    deselectElement();
    hideDeleteOverlay();
    isDragging = false;
  }
}

function handlePointerMove(e, img, canvas) {
  e.preventDefault();
  if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY,imageId:img.id});
  if (activePointers.size===2 && pinchState && pinchState.imageId===img.id) {
    const pts=[...activePointers.values()];
    const newDist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    const delta=(newDist-pinchState.dist)*0.012;
    if(Math.abs(delta)>0.003){zoomImage(img.id,delta);pinchState.dist=newDist;}
    return;
  }
  const pos = getPointerPos(e, canvas);
  if (pencilMode && pencilMode.imageId===img.id) {
    let previewPos={x:pos.x,y:pos.y}; snapGuides=[];
    if(pencilMode.points.length>0){
      const last=pencilMode.points[pencilMode.points.length-1];
      const snap=findSnapPoint(img,pos.x,pos.y,-1);
      if(snap){previewPos={x:snap.x,y:snap.y};}
      else{const align=getAlignmentSnap(last.x,last.y,pos.x,pos.y);previewPos={x:align.x,y:align.y};snapGuides=align.guides;}
    }
    pencilMode.currentPos=previewPos; redrawImage(img); return;
  }
  if (!isDragging || selectedElement.imageId!==img.id) return;
  const elem = img.elements[selectedElement.index];
  if (!elem) return;
  let finalX=pos.x, finalY=pos.y;
  if (isResizingEndpoint==='start'||isResizingEndpoint==='end'||(isResizingEndpoint&&isResizingEndpoint.startsWith('point_'))) {
    const snap=findSnapPoint(img,pos.x,pos.y,selectedElement.index);
    if(snap){finalX=snap.x;finalY=snap.y;}
  }
  if (isResizingEndpoint==='start'){elem.x1=finalX;elem.y1=finalY;}
  else if(isResizingEndpoint==='end'){elem.x2=finalX;elem.y2=finalY;}
  else if(isResizingEndpoint==='resize'){resizeElement(elem,pos.x,pos.y);}
  else if(isResizingEndpoint&&isResizingEndpoint.startsWith('point_')){
    const pIdx=parseInt(isResizingEndpoint.split('_')[1]);
    if(elem.points&&elem.points[pIdx]){elem.points[pIdx].x=finalX;elem.points[pIdx].y=finalY;}
  } else {
    moveElement(elem,pos.x-dragStartPos.x,pos.y-dragStartPos.y);
    dragStartPos=pos;
  }
  redrawImage(img);
  updateDeleteOverlayPosition();
}

function handlePointerUp(e, img, canvas) {
  activePointers.delete(e.pointerId);
  if (activePointers.size<2) pinchState=null;
  isDragging=false; isResizingEndpoint=null;
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
  updateImageCounter(img);
  renderPageOverviewDebounced();
}

function handleDoubleClick(e, img, canvas) {
  if (pencilMode && pencilMode.imageId===img.id) finishDrawing();
}

function moveElement(elem, dx, dy) {
  switch(elem.type){
    case 'line': case 'line_circle': elem.x1+=dx;elem.y1+=dy;elem.x2+=dx;elem.y2+=dy; break;
    case 'polyline': if(elem.points) elem.points.forEach(p=>{p.x+=dx;p.y+=dy;}); break;
    case 'circle': elem.x+=dx;elem.y+=dy; break;
    case 'rect': elem.x+=dx;elem.y+=dy; break;
    case 'gfta': elem.x1+=dx;elem.y1+=dy; break;
    case 'text': elem.x+=dx;elem.y+=dy; break;
  }
}

function resizeElement(elem, x, y) {
  switch(elem.type){
    case 'circle': elem.radius=Math.max(10,Math.hypot(x-elem.x,y-elem.y)); break;
    case 'rect':   elem.width=Math.max(20,x-elem.x); elem.height=Math.max(20,y-elem.y); break;
    case 'gfta': {
      const rot=elem.rotation||0;
      if(rot===0){const tw=Math.max(40,x-elem.x1);elem.width=(tw-elem.spacing)/2;elem.height=Math.max(15,y-elem.y1);}
      else{elem.width=Math.max(15,x-elem.x1);const th=Math.max(40,y-elem.y1);elem.height=(th-elem.spacing)/2;}
      break;
    }
  }
}

function updateImageCounter(img) {
  const el = document.getElementById(`counter-${img.id}`);
  if (el) el.textContent = `${img.elements.length} Element${img.elements.length!==1?'e':''}`;
}

// Element-Löschen-Overlay (× Button)
function showDeleteOverlay(img, elemIndex, canvas) {
  const elem = img.elements[elemIndex];
  if (!elem || !canvas) return;
  const rect  = canvas.getBoundingClientRect();
  const scaleX = rect.width  / canvas.width;
  const scaleY = rect.height / canvas.height;
  let cx, cy;
  switch(elem.type){
    case 'line': case 'line_circle': cx=(elem.x1+elem.x2)/2; cy=Math.min(elem.y1,elem.y2); break;
    case 'polyline': if(elem.points&&elem.points.length>0){cx=elem.points[0].x;cy=elem.points[0].y;} else return; break;
    case 'circle':   cx=elem.x; cy=elem.y-elem.radius; break;
    case 'rect':     cx=elem.x+elem.width/2; cy=elem.y; break;
    case 'gfta':     cx=elem.x1+elem.width/2; cy=elem.y1; break;
    case 'text':     cx=elem.x; cy=elem.y; break;
    default: return;
  }
  const btn = document.getElementById('elemDeleteBtn');
  btn.style.left = (rect.left + cx*scaleX - 16) + 'px';
  btn.style.top  = (rect.top  + cy*scaleY - 40) + 'px';
  btn.className  = 'visible';
  btn.dataset.imageId  = img.id;
  btn.dataset.elemIndex = elemIndex;
}

function hideDeleteOverlay() {
  const btn = document.getElementById('elemDeleteBtn');
  btn.className = '';
}

function updateDeleteOverlayPosition() {
  if (selectedElement.imageId === null) return;
  const img = images.find(i => i.id === selectedElement.imageId);
  if (!img) return;
  const canvas = document.getElementById(`canvas-${img.id}`);
  if (!canvas) return;
  showDeleteOverlay(img, selectedElement.index, canvas);
}

function deleteSelectedElement() {
  const btn = document.getElementById('elemDeleteBtn');
  const imageId   = btn.dataset.imageId;
  const elemIndex = parseInt(btn.dataset.elemIndex);
  const img = images.find(i => i.id === imageId);
  if (!img || isNaN(elemIndex)) return;
  pushHistory(img);
  img.elements.splice(elemIndex, 1);
  deselectElement();
  hideDeleteOverlay();
  redrawImage(img);
  updateImageCounter(img);
  renderPageOverviewDebounced();
  showStatus('🗑️ Element gelöscht', 'info');
}

function deselectElement() {
  if (selectedElement.imageId) {
    const img = images.find(i => i.id === selectedElement.imageId);
    selectedElement = { imageId:null, index:-1 };
    if (img) redrawImage(img);
  } else {
    selectedElement = { imageId:null, index:-1 };
  }
}
// ===== MODUL 6: TOUCH/PENCIL-EVENTS — END (Abschnitt: Pointer Events) =====

// ===== MODUL 8: ZICKZACK/POLYLINE — START =====
function startPencilDraw(color) {
  deactivateAllErasers();
  if (selectToolActive) { selectToolActive=false; document.getElementById('selectToolBtn').classList.remove('active'); }
  hideDeleteOverlay(); deselectElement();
  if (!activeImageId) {
    if (images.length>0) activeImageId=images[0].id;
    else { showStatus('⚠️ Zuerst Bild hochladen','error'); return; }
  }
  pencilMode = { color, points:[], imageId:activeImageId, currentPos:null, pointHistory:[] };
  document.getElementById('drawingBanner').classList.add('active');
  const canvas = document.getElementById(`canvas-${activeImageId}`);
  if (canvas) { canvas.classList.add('pencil-mode'); canvas.classList.remove('select-mode'); }
  document.getElementById(`pencil-btn-${color}`).classList.add('active');
  updatePencilBanner();
  showStatus('✏️ Klick = Punkt | Doppelklick = Beenden | ↶ = Punkt rückgängig','info');
}

function undoPencilPoint() {
  if (!pencilMode) return;
  if (pencilMode.pointHistory.length>0) {
    pencilMode.points = pencilMode.pointHistory.pop();
    updatePencilBanner();
    const img=images.find(i=>i.id===pencilMode.imageId);
    if(img) redrawImage(img);
  }
}

function updatePencilBanner() {
  if (!pencilMode) return;
  const n=pencilMode.points.length;
  document.getElementById('drawingBannerText').textContent=`✏️ ${n} Punkt${n!==1?'e':''}`;
  document.getElementById('pencilUndoBtn').disabled=n===0;
}

function finishDrawing() {
  if (!pencilMode||pencilMode.points.length<2){cancelDrawing();return;}
  const img=images.find(i=>i.id===pencilMode.imageId);
  if(img){
    pushHistory(img);
    const color=pencilMode.color==='blue'?'#0066FF':'#9333EA';
    img.elements.push({type:'polyline',points:[...pencilMode.points],color,lineWidth:Math.max(4,img.image.width/350)});
    selectedElement={imageId:img.id,index:img.elements.length-1};
    redrawImage(img); renderPageOverviewDebounced();
    showStatus(`✅ ${pencilMode.points.length} Punkte verbunden`,'success');
  }
  cancelDrawing();
}

function cancelDrawing() {
  if(pencilMode){
    const canvas=document.getElementById(`canvas-${pencilMode.imageId}`);
    if(canvas) canvas.classList.remove('pencil-mode');
    document.getElementById(`pencil-btn-${pencilMode.color}`)?.classList.remove('active');
    const img=images.find(i=>i.id===pencilMode.imageId);
    if(img) redrawImage(img);
  }
  pencilMode=null; snapGuides=[];
  document.getElementById('drawingBanner').classList.remove('active');
}
// ===== MODUL 8: ZICKZACK/POLYLINE — END =====

// ===== MODUL 9: UNDO & RADIERER — START =====
function undoLast(imageId) {
  if(pencilMode&&pencilMode.imageId===imageId){undoPencilPoint();return;}
  const img=images.find(i=>i.id===imageId);
  if(!img||img.history.length===0){showStatus('⚠️ Nichts mehr rückgängig','info');return;}
  img.elements=img.history.pop();
  deselectElement(); hideDeleteOverlay();
  redrawImage(img); updateImageCounter(img); renderPageOverviewDebounced();
  showStatus('↶ Rückgängig','info');
}

// Radierer: grün = aktiv, grau = inaktiv
// Auto-deaktiviert wenn anderes Tool gewählt
function toggleEraser(imageId) {
  const img=images.find(i=>i.id===imageId);
  if(!img) return;
  // Auswahl-Tool deaktivieren
  if(selectToolActive){selectToolActive=false;document.getElementById('selectToolBtn').classList.remove('active');}
  // Pencil-Modus beenden
  if(pencilMode) cancelDrawing();
  img.eraserMode=!img.eraserMode;
  const canvas=document.getElementById(`canvas-${img.id}`);
  if(canvas) canvas.classList.toggle('eraser-mode',img.eraserMode);
  const btn=document.getElementById(`eraser-${img.id}`);
  if(btn) btn.classList.toggle('eraser-active',img.eraserMode);
  showStatus(img.eraserMode?'🧹 Radierer aktiv – Element antippen zum Löschen':'✏️ Normal-Modus','info');
}

function deactivateAllErasers() {
  images.forEach(img => {
    if(img.eraserMode){
      img.eraserMode=false;
      const canvas=document.getElementById(`canvas-${img.id}`);
      if(canvas) canvas.classList.remove('eraser-mode');
      const btn=document.getElementById(`eraser-${img.id}`);
      if(btn) btn.classList.remove('eraser-active');
    }
  });
}

// Auswahl-Werkzeug (Cursor) – globaler Toggle
function toggleSelectTool() {
  if(pencilMode) cancelDrawing();
  deactivateAllErasers();
  selectToolActive=!selectToolActive;
  document.getElementById('selectToolBtn').classList.toggle('active',selectToolActive);
  if(!selectToolActive){ hideDeleteOverlay(); deselectElement(); }
  showStatus(selectToolActive?'🖱️ Auswahl-Modus: Element antippen zum Auswählen':'✏️ Normal-Modus','info');
}
// ===== MODUL 9: UNDO & RADIERER — END =====

// ===== MODUL 10: BILD-VERWALTUNG — START (Abschnitt: Seitenübersicht) =====
let overviewSelectionMode = false;

function toggleOverviewSelectMode() {
  overviewSelectionMode = !overviewSelectionMode;
  const btn     = document.getElementById('poSelectToggle');
  const actions = document.getElementById('poActions');
  btn.classList.toggle('active', overviewSelectionMode);
  actions.classList.toggle('show-actions', overviewSelectionMode);
  renderPageOverview();
}

function renderPageOverview() {
  const container = document.getElementById('pageThumbnails');
  const counter   = document.getElementById('selectedCount');
  if (counter) {
    const sel = images.filter(i=>i.selected).length;
    counter.textContent = `${sel}/${images.length}`;
  }

  if (images.length===0) {
    container.innerHTML='<p style="font-size:11px;color:#bbb;text-align:center;padding:20px 0;">Keine Bilder</p>';
    return;
  }

  container.className = 'page-thumbnails' + (overviewSelectionMode ? ' selection-mode' : '');

  container.innerHTML = images.map((img) => `
    <div class="page-thumbnail ${img.selected&&overviewSelectionMode?'selected':''} ${img.id===activeImageId?'thumb-active':''}"
         data-image-id="${img.id}"
         onclick="thumbClickHandler(event,'${img.id}')">
      <input type="checkbox" class="page-thumb-checkbox"
             ${img.selected?'checked':''}
             onchange="togglePageSelection('${img.id}',event)"
             onclick="event.stopPropagation()">
      <div class="page-thumb-content">
        <img src="${img.imageDataUrl}" class="page-thumb-img" alt="" draggable="false">
        <div class="page-thumb-info">
          <span class="page-thumb-num${img.showPageNumber?'':' no-pagenum'}">${img.autoNumber}</span>
          <span class="page-thumb-name">${img.name.length>14?img.name.substring(0,13)+'…':img.name}</span>
        </div>
        <div class="page-thumb-count">${img.elements.length} Elemente</div>
      </div>
    </div>
  `).join('');

  setupThumbnailDragDrop();
}

function thumbClickHandler(e, imageId) {
  if(e.target.tagName==='INPUT') return;
  setActiveImage(imageId);
  const card=document.querySelector(`[data-image-id="${imageId}"].image-card`);
  if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
}

function togglePageSelection(imageId, e) {
  const img=images.find(i=>i.id===imageId);
  if(img){img.selected=e.target.checked; renderPageOverview();}
}
function selectAllPages()   { images.forEach(i=>i.selected=true);  renderPageOverview(); }
function deselectAllPages() { images.forEach(i=>i.selected=false); renderPageOverview(); }

function deleteSelectedPages() {
  const toDelete=images.filter(i=>i.selected);
  if(toDelete.length===0){showStatus('⚠️ Keine Bilder ausgewählt','error');return;}
  if(!confirm(`${toDelete.length} Bild${toDelete.length>1?'er':''} wirklich löschen?`)) return;
  const toDeleteIds=new Set(toDelete.map(i=>i.id));
  images=images.filter(i=>!toDeleteIds.has(i.id));
  if(activeImageId&&!images.find(i=>i.id===activeImageId)) activeImageId=images.length>0?images[0].id:null;
  deselectElement(); hideDeleteOverlay();
  updateAllNumbers();
  // DOM direkt bereinigen (schneller als renderAllImages)
  toDeleteIds.forEach(id=>{
    const card=document.querySelector(`.image-card[data-image-id="${id}"]`);
    if(card) card.remove();
  });
  // Verbleibende neu durchnummerieren
  images.forEach(img=>{
    const badge=document.querySelector(`.image-card[data-image-id="${img.id}"] .image-number-badge`);
    if(badge) badge.textContent=img.autoNumber;
    redrawImage(img);
  });
  renderPageOverview();
  showStatus(`🗑️ ${toDelete.length} Bild${toDelete.length>1?'er':''} gelöscht`,'success');
}

function setupThumbnailDragDrop() {
  if(thumbDragCleanup) thumbDragCleanup();
  const thumbs=document.querySelectorAll('.page-thumbnail');
  const listenerRefs=[];
  thumbs.forEach(thumb=>{
    const pdHandler=(e)=>{
      if(e.target.tagName==='INPUT') return;
      e.preventDefault();
      const startX=e.clientX, startY=e.clientY;
      const imageId=thumb.dataset.imageId;
      let dragStarted=false;
      const moveH=(me)=>{
        if(!dragStarted){
          if(Math.abs(me.clientX-startX)>8||Math.abs(me.clientY-startY)>8){dragStarted=true;beginThumbDrag(imageId,thumb,me);}
        } else { moveThumbDrag(me); }
      };
      const upH=()=>{
        document.removeEventListener('pointermove',moveH);
        document.removeEventListener('pointerup',upH);
        if(dragStarted) finishThumbDrag(); else thumbDragState.active=false;
      };
      document.addEventListener('pointermove',moveH);
      document.addEventListener('pointerup',upH);
    };
    thumb.addEventListener('pointerdown',pdHandler);
    listenerRefs.push({el:thumb,fn:pdHandler});
  });
  thumbDragCleanup=()=>{ listenerRefs.forEach(({el,fn})=>el.removeEventListener('pointerdown',fn)); listenerRefs.length=0; };
}

function beginThumbDrag(imageId, thumbEl, e) {
  thumbDragState={active:true,imageId,ghost:null,overImageId:null,overBefore:false};
  thumbEl.classList.add('dragging');
  const ghost=document.createElement('div');
  ghost.className='drag-ghost';
  ghost.innerHTML=thumbEl.querySelector('.page-thumb-content').innerHTML;
  ghost.style.left=(e.clientX-80)+'px'; ghost.style.top=(e.clientY-30)+'px';
  document.body.appendChild(ghost); thumbDragState.ghost=ghost;
}

function moveThumbDrag(e) {
  if(!thumbDragState.active||!thumbDragState.ghost) return;
  thumbDragState.ghost.style.left=(e.clientX-80)+'px';
  thumbDragState.ghost.style.top=(e.clientY-30)+'px';
  document.querySelectorAll('.page-thumbnail').forEach(t=>t.classList.remove('drag-over-top','drag-over-bottom'));
  const els=document.elementsFromPoint(e.clientX,e.clientY);
  const target=els.find(el=>el.classList&&el.classList.contains('page-thumbnail')&&el.dataset.imageId!==thumbDragState.imageId);
  if(target){
    const rect=target.getBoundingClientRect();
    thumbDragState.overImageId=target.dataset.imageId;
    thumbDragState.overBefore=e.clientY<rect.top+rect.height/2;
    target.classList.add(thumbDragState.overBefore?'drag-over-top':'drag-over-bottom');
  } else { thumbDragState.overImageId=null; }
}

function finishThumbDrag() {
  if(thumbDragState.ghost){thumbDragState.ghost.remove();thumbDragState.ghost=null;}
  document.querySelectorAll('.page-thumbnail').forEach(t=>t.classList.remove('dragging','drag-over-top','drag-over-bottom'));
  if(thumbDragState.overImageId&&thumbDragState.imageId){
    const fromIdx=images.findIndex(i=>i.id===thumbDragState.imageId);
    const toIdx=images.findIndex(i=>i.id===thumbDragState.overImageId);
    if(fromIdx>=0&&toIdx>=0&&fromIdx!==toIdx){
      const [moved]=images.splice(fromIdx,1);
      const newToIdx=images.findIndex(i=>i.id===thumbDragState.overImageId);
      images.splice(thumbDragState.overBefore?newToIdx:newToIdx+1,0,moved);
      updateAllNumbers();
      // Performance: nur Reihenfolge im DOM ändern, nicht alles neu bauen
      const area=document.getElementById('canvasArea');
      images.forEach(img=>{
        const card=area.querySelector(`.image-card[data-image-id="${img.id}"]`);
        if(card) area.appendChild(card);
        const badge=card&&card.querySelector('.image-number-badge');
        if(badge) badge.textContent=img.autoNumber;
        redrawImage(img);
      });
      renderPageOverview();
      showStatus('✅ Reihenfolge geändert','success');
    }
  }
  thumbDragState={active:false,imageId:null,ghost:null,overImageId:null,overBefore:false};
}

function togglePageOverview() {
  const overview=document.getElementById('pageOverview');
  const btn=document.getElementById('toggleOverview');
  if(window.innerWidth<=850){
    const isOpen=overview.classList.toggle('po-open');
    btn.textContent=isOpen?'✕':'☰';
  }
}

function deleteImage(imageId) {
  if(!confirm('Bild wirklich löschen?')) return;
  const idx=images.findIndex(i=>i.id===imageId);
  if(idx>=0){
    images.splice(idx,1);
    if(activeImageId===imageId) activeImageId=images.length>0?images[0].id:null;
    deselectElement(); hideDeleteOverlay();
    const card=document.querySelector(`.image-card[data-image-id="${imageId}"]`);
    if(card) card.remove();
    updateAllNumbers();
    images.forEach(img=>{
      const badge=document.querySelector(`.image-card[data-image-id="${img.id}"] .image-number-badge`);
      if(badge) badge.textContent=img.autoNumber;
      redrawImage(img);
    });
    renderPageOverview();
    showStatus('🗑️ Bild gelöscht','info');
  }
}

function saveImage(imageId) {
  const img=images.find(i=>i.id===imageId);
  if(!img) return;
  const basename=img.name.replace(/\.[^/.]+$/,'');
  const json={version:'6.0',name:img.name,timestamp:new Date().toISOString(),canvasWidth:img.image.width,canvasHeight:img.image.height,elements:img.elements};
  downloadFile(JSON.stringify(json,null,2),`${basename}.json`,'application/json');
  const exportCanvas=buildExportCanvas(img);
  exportCanvas.toBlob(blob=>{downloadFile(blob,`${basename}.jpg`,'image/jpeg');showStatus(`✅ Gespeichert: ${basename}`,'success');},'image/jpeg',1.0);
}
// ===== MODUL 10: BILD-VERWALTUNG — END (Abschnitt: Seitenübersicht) =====

// ===== MODUL 11: EXPORT/IMPORT — START =====

// Cloud-Vorbereitung: Zentraler AppStorage-Service
// Später: localStorage durch API-Calls ersetzen ohne restlichen Code zu ändern
const AppStorage = {
  save(key, data) {
    try { localStorage.setItem('gf_' + key, JSON.stringify(data)); } catch(e) { /* quota */ }
  },
  load(key) {
    try { const d=localStorage.getItem('gf_' + key); return d ? JSON.parse(d) : null; } catch(e) { return null; }
  },
  remove(key) {
    try { localStorage.removeItem('gf_' + key); } catch(e) {}
  }
};

function buildExportCanvas(img) {
  const ec=document.createElement('canvas');
  ec.width=img.image.width; ec.height=img.image.height;
  const ctx=ec.getContext('2d');
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(img.image,0,0);
  img.elements.forEach(elem=>drawElement(ctx,elem,false));
  const address=document.getElementById('addressInput').value.trim();
  if(address) drawAddressOnCanvas(ctx,img.image.width,img.image.height,address);
  return ec;
}

function drawAddressOnCanvas(ctx, w, h, address) {
  const fontSize=Math.max(14,Math.min(28,w/70));
  ctx.save();
  ctx.font=`600 ${fontSize}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
  const tw=ctx.measureText(address).width;
  const pad=9, margin=18;
  const bx=w-tw-pad*2-margin, by=h-fontSize-pad*2-margin;
  ctx.fillStyle='rgba(255,255,255,0.82)';
  roundRect(ctx,bx,by,tw+pad*2,fontSize+pad*2,5); ctx.fill();
  ctx.fillStyle='#222'; ctx.textBaseline='top';
  ctx.fillText(address,bx+pad,by+pad);
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function getZipFilename() {
  const address=document.getElementById('addressInput').value.trim();
  if(address){const safe=address.replace(/[\/\\:*?"<>|]/g,'').replace(/\s+/g,'_');return`${safe}.zip`;}
  const now=new Date();
  const date=now.toISOString().slice(0,10);
  const time=`${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}`;
  return `Hausbegehung_${date}_${time}.zip`;
}

async function exportSelectedAsZip() {
  const selected=images.filter(i=>i.selected);
  const toExport=selected.length>0?selected:images;
  if(toExport.length===0){showStatus('⚠️ Keine Bilder zum Exportieren','error');return;}
  showStatus(`📦 ZIP wird erstellt: ${toExport.length} Bilder …`,'info');
  const zip=new JSZip();
  for(const img of toExport){
    const basename=img.name.replace(/\.[^/.]+$/,'');
    const json={version:'6.0',name:img.name,timestamp:new Date().toISOString(),canvasWidth:img.image.width,canvasHeight:img.image.height,elements:img.elements};
    zip.file(`${basename}.json`,JSON.stringify(json,null,2));
    const ec=buildExportCanvas(img);
    const blob=await new Promise(r=>ec.toBlob(r,'image/jpeg',1.0));
    zip.file(`${basename}.jpg`,blob);
  }
  const zipBlob=await zip.generateAsync({type:'blob'});
  downloadFile(zipBlob,getZipFilename(),'application/zip');
  showStatus(`✅ ZIP exportiert: ${toExport.length} Bilder (HD)`,'success');
}

function clearAllImages() {
  if(!confirm('Wirklich ALLE Bilder löschen?')) return;
  images=[]; activeImageId=null; selectedElement={imageId:null,index:-1}; zoomLevels={};
  hideDeleteOverlay();
  renderAllImages(); renderPageOverview(); showStatus('🗑️ Alles gelöscht','info');
}

function downloadFile(data, filename, mimeType) {
  const blob=data instanceof Blob?data:new Blob([data],{type:mimeType});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function showStatus(msg, type) {
  const bar=document.getElementById('statusBar');
  bar.textContent=msg; bar.style.display=''; bar.className=`status-${type}`;
  clearTimeout(bar._t);
  bar._t=setTimeout(()=>{bar.style.display='none';bar.className='';},3500);
}
// ===== MODUL 11: EXPORT/IMPORT — END =====

// ===== MODUL 12: INITIALISIERUNG — START =====
renderPageOverview();

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(pencilMode) cancelDrawing();
    if(selectToolActive){selectToolActive=false;document.getElementById('selectToolBtn').classList.remove('active');hideDeleteOverlay();deselectElement();}
    if(document.getElementById('textModal').classList.contains('active')) closeTextModal();
  }
  if(e.key==='Enter'&&document.getElementById('textModal').classList.contains('active')) addCustomText();
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();if(activeImageId) undoLast(activeImageId);}
});

window.addEventListener('resize',()=>{
  const overview=document.getElementById('pageOverview');
  if(window.innerWidth>850){overview.classList.remove('po-open');document.getElementById('toggleOverview').textContent='☰';}
  updateDeleteOverlayPosition();
});

// Overlay ausblenden bei Scroll
document.getElementById('canvasArea').addEventListener('scroll',()=>{ if(selectedElement.imageId) updateDeleteOverlayPosition(); });
// ===== MODUL 12: INITIALISIERUNG — END =====
