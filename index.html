<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Glasfaser Hausbegehung v5.0 (Pro)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg-primary: #1a1a1a;
    --bg-sidebar: #242424;
    --bg-card: #2d2d2d;
    --accent: #0066FF;
    --text-main: #ffffff;
    --text-muted: #aaaaaa;
    --border-color: #3d3d3d;
    --safe-area-top: env(safe-area-inset-top, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: var(--bg-primary); color: var(--text-main); overflow: hidden; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; padding-top: var(--safe-area-top); }

  /* APP HEADER */
  .header { background: var(--bg-sidebar); padding: 14px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: space-between; gap: 16px; z-index: 100; border-bottom: 1px solid var(--border-color); }
  .header-left { display: flex; align-items: center; gap: 15px; }
  .header-title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
  .header-title span { color: var(--accent); font-size: 12px; background: rgba(0,102,255,0.15); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(0,102,255,0.3); }
  
  .address-container { display: flex; align-items: center; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px 12px; width: 320px; transition: border-color 0.2s; }
  .address-container:focus-within { border-color: var(--accent); }
  .address-input { background: transparent; border: none; color: var(--text-main); font-size: 14px; width: 100%; outline: none; user-select: text; }
  .address-input::placeholder { color: var(--text-muted); }

  .btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); min-height: 44px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); border-color: var(--accent); }
  .btn-danger { background: #FF3B30; border-color: #FF3B30; }

  /* MAIN CONTENT AREA */
  .main-container { display: flex; flex: 1; position: relative; overflow: hidden; }

  /* SIDEBAR (PAGE OVERVIEW) */
  .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 90; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .sidebar-header { padding: 16px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
  .page-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
  
  .page-item { background: var(--bg-card); border: 2px solid var(--border-color); border-radius: 10px; padding: 8px; cursor: pointer; position: relative; transition: all 0.2s; touch-action: none; }
  .page-item.active { border-color: var(--accent); background: rgba(0,102,255,0.05); }
  .page-item.dragging { opacity: 0.5; border-style: dashed; transform: scale(0.95); }
  .page-thumb-container { width: 100%; height: 120px; background: #111; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
  .page-thumb { max-width: 100%; max-height: 100%; object-fit: contain; }
  .page-meta { margin-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500; }
  .page-badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  .btn-delete-page { position: absolute; top: 12px; right: 12px; background: rgba(255,59,48,0.9); border: none; width: 28px; height: 28px; border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.2s; z-index: 5; }
  .page-item:hover .btn-delete-page { opacity: 1; }

  /* CANVAS WORKSPACE */
  .workspace { flex: 1; position: relative; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
  #canvasContainer { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: 0 0; }
  canvas { box-shadow: 0 10px 40px rgba(0,0,0,0.5); background: #000; touch-action: none; max-width: 100%; max-height: 100%; }

  /* ICON-ONLY MINIMALIST TOOLBAR (PROCREATE STYLE) */
  .toolbar-floating { position: absolute; top: 20px; right: 20px; background: rgba(36,36,36,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 12px 36px rgba(0,0,0,0.4); z-index: 95; }
  .tool-group { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin-bottom: 2px; }
  .tool-group:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  
  .tool-btn { width: 46px; height: 46px; border-radius: 10px; border: none; background: transparent; color: var(--text-main); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: all 0.15s; position: relative; }
  .tool-btn svg { width: 22px; height: 22px; fill: currentColor; stroke: currentColor; stroke-width: 0; }
  .tool-btn:active { transform: scale(0.92); }
  .tool-btn.active { background: var(--accent); color: white; }
  .tool-btn .color-dot { width: 8px; height: 8px; border-radius: 50%; position: absolute; bottom: 4px; right: 4px; border: 1px solid var(--bg-sidebar); }

  /* OVERLAYS & STATUS */
  #statusBar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 12px; background: rgba(36,36,36,0.9); backdrop-filter: blur(10px); border: 1px solid var(--border-color); color: white; font-size: 14px; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.3); display: none; z-index: 200; pointer-events: none; animation: fadeInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .status-success { border-left: 4px solid #34C759 !important; }
  .status-error { border-left: 4px solid #FF3B30 !important; }
  .status-info { border-left: 4px solid var(--accent) !important; }

  /* WATERMARK & NUMBER OVERLAY FOR VISUAL REFERENCE IN APP */
  .canvas-overlay-info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; pointer-events: none; z-index: 80; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 2px; }

  /* TEXT INPUT MODAL */
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .modal-header { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal-input { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: white; font-size: 16px; margin-bottom: 20px; outline: none; user-select: text; }
  .modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }

  /* UPLOAD DROPZONE */
  .dropzone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed var(--border-color); margin: 40px; border-radius: 20px; background: rgba(255,255,255,0.02); cursor: pointer; transition: background 0.2s; padding: 20px; text-align: center; }
  .dropzone:hover { background: rgba(255,255,255,0.04); border-color: var(--accent); }
  .dropzone svg { width: 48px; height: 48px; fill: var(--text-muted); margin-bottom: 16px; }

  /* TOGGLE SIDEBAR BUTTON FOR PORTRAIT MODE */
  .sidebar-toggle { display: none; width: 44px; height: 44px; justify-content: center; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; }

  /* RESPONSIVE DESIGN (PORTRAIT OPTIMIZATION) */
  @media (max-width: 1024px) {
    .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.3); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: flex; }
    .address-container { width: 200px; }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <button class="sidebar-toggle" id="sidebarToggleBtn" onclick="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div class="header-title">AI Initiative EU <span>v5.0 Pro</span></div>
      <div class="address-container">
        <input type="text" id="addressInput" class="address-input" placeholder="Adresse eingeben (z.B. Holzapfelstr. 10)..." oninput="updateAddressWatermark()">
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="document.getElementById('fileFileInput').click()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        Fotos hinzufügen
      </button>
      <button class="btn btn-primary" onclick="exportAllToZIP()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
        ZIP exportieren
      </button>
      <button class="btn btn-danger" onclick="clearAllImages()" style="padding: 10px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
    </div>
    <input type="file" id="fileFileInput" multiple accept="image/*" style="display:none" onchange="handleFileSelect(event)">
  </div>

  <div class="main-container">
    
    <div class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <span>Seiten-Übersicht</span>
        <span class="page-badge" id="pageCountBadge">0 Bilder</span>
      </div>
      <div class="page-list" id="pageListContainer">
        </div>
    </div>

    <div class="workspace" id="workspaceContainer">
      
      <div class="dropzone" id="emptyDropzone" onclick="document.getElementById('fileFileInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <h3>Glasfaser Hausbegehung Markierungstool</h3>
        <p style="color: var(--text-muted); margin-top: 8px; font-size: 14px;">Bilder hier hineinziehen oder klicken zum Auswählen</p>
      </div>

      <div id="canvasContainer" style="display:none;">
        <canvas id="markupCanvas"></canvas>
      </div>

      <div class="canvas-overlay-info" id="canvasHudOverlay" style="display:none;">
        <div id="hudAddress" style="color:#fff; font-weight:600;">Keine Adresse</div>
        <div id="hudImageNum" style="color:var(--accent);">Bild --/--</div>
      </div>

      <div class="toolbar-floating" id="appToolbar" style="display:none;">
        <div class="tool-group">
          <button class="tool-btn active" id="tool_pan" onclick="setTool('pan')" title="Verschieben / Zoom">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><polyline points="21 15 21 21 15 21"></polyline><polyline points="3 9 3 3 9 3"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line><line x1="14" y1="14" x2="21" y2="21"></line><line x1="3" y1="3" x2="10" y2="10"></line></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="tool_line_purple" onclick="setTool('line', '#bf5af2', 'inside')" title="Kunststofftrasse Innen/Keller (Lila)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#bf5af2" stroke-width="3.5"><line x1="4" y1="20" x2="20" y2="4"></line></svg>
            <div class="color-dot" style="background:#bf5af2;"></div>
          </button>
          <button class="tool-btn" id="tool_line_blue" onclick="setTool('line', '#0066FF', 'outside')" title="Metalltrasse Außen (Blau)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="3.5"><line x1="4" y1="20" x2="20" y2="4"></line></svg>
            <div class="color-dot" style="background:#0066FF;"></div>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="tool_poly_yellow" onclick="setTool('polyline', '#0066FF', 'vert')" title="Trasse mit Vertikalbohrung Gelb (Zickzack)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="2.5"><polyline points="3 17 9 7 15 17 20 7"></polyline><circle cx="20" cy="7" r="3" stroke="#ffd60a" stroke-width="2"></circle></svg>
          </button>
          <button class="tool-btn" id="tool_poly_red" onclick="setTool('polyline', '#bf5af2', 'horiz')" title="Trasse mit Horizontalbohrung Rot (Zickzack)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#bf5af2" stroke-width="2.5"><polyline points="3 17 9 7 15 17 20 7"></polyline><circle cx="20" cy="7" r="3" stroke="#ff453a" stroke-width="2"></circle></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="tool_circle_yellow" onclick="setTool('circle', '#ffd60a')" title="Vertikale Bohrung (Gelber Kreis)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffd60a" stroke-width="3"><circle cx="12" cy="12" r="8"></circle></svg>
          </button>
          <button class="tool-btn" id="tool_circle_red" onclick="setTool('circle', '#ff453a')" title="Horizontale Bohrung (Roter Kreis)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="3"><circle cx="12" cy="12" r="8"></circle></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="tool_rect_gfta" onclick="setTool('rect', '#30d158', 'GFTA')" title="Komponente GFTA / Abschlusspunkt">
            <svg viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2.5"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
          </button>
          <button class="tool-btn" id="tool_rect_splitter" onclick="setTool('rect', '#ff9f0a', 'Splitter')" title="Komponente Splitter / Verteiler">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ff9f0a" stroke-width="2.5"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
          </button>
          <button class="tool-btn" id="tool_text" onclick="setTool('text', '#ffffff')" title="Freier Text">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="tool_eraser" onclick="setTool('eraser')" title="Radierer (Element direkt anklicken zum Löschen)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 14V20Z"></path><line x1="6" y1="11" x2="16" y2="21"></line></svg>
          </button>
          <button class="tool-btn" onclick="executeUndo()" title="Schritt zurück (Undo)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="modal" id="textModal">
    <div class="modal-content">
      <div class="modal-header" id="textModalTitle">Text eingeben</div>
      <input type="text" id="textModalInput" class="modal-input" placeholder="Z.B. Keller 1, EG links...">
      <div class="modal-actions">
        <button class="btn" onclick="closeTextModal(false)">Abbrechen</button>
        <button class="btn btn-primary" onclick="closeTextModal(true)">Übernehmen</button>
      </div>
    </div>
  </div>

  <script>
    let images = []; 
    let activeImageId = null;
    let currentTool = 'pan'; 
    let currentColor = '#0066FF';
    let toolSubtype = null; 

    // Canvas Engine State
    const canvas = document.getElementById('markupCanvas');
    const ctx = canvas.getContext('2d');
    
    let scale = 1.0;
    let panX = 0;
    let panY = 0;
    let isDrawing = false;
    let isPanning = false;
    
    // Polyline Drawing State
    let currentPolylinePoints = [];

    // Pointer Management & Pinch-Zoom State
    let pointerCache = [];
    let prevDiff = -1;
    let startPanX = 0, startPanY = 0;
    let startPointerX = 0, startPointerY = 0;

    // Drag and Drop State for Sidebar Reordering
    let draggedItemIndex = null;

    // Initialization
    window.addEventListener('resize', () => resizeCanvasToFitImage());
    setupWorkspaceDropzone();
    initPointerEvents();

    function setupWorkspaceDropzone() {
      const zone = document.getElementById('workspaceContainer');
      zone.addEventListener('dragover', (e) => e.preventDefault());
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) {
          importFiles(e.dataTransfer.files);
        }
      });
    }

    function toggleSidebar() {
      document.getElementById('appSidebar').classList.toggle('open');
    }

    function updateAddressWatermark() {
      const val = document.getElementById('addressInput').value;
      document.getElementById('hudAddress').textContent = val ? val : "Keine Adresse";
    }

    function setTool(tool, color = null, subtype = null) {
      currentTool = tool;
      toolSubtype = subtype;
      if (color) currentColor = color;
      
      // End polyline if changing tool midway
      if (tool !== 'polyline' && currentPolylinePoints.length > 0) {
        commitPolyline();
      }

      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      const activeId = `tool_${tool}${subtype ? '_' + subtype : (color && tool !== 'text' ? '_' + (color === '#ffd60a' ? 'yellow' : color === '#ff453a' ? 'red' : color === '#bf5af2' ? 'purple' : 'blue') : '')}`;
      const btn = document.getElementById(activeId);
      if (btn) btn.classList.add('active');
      
      showStatus(`Werkzeug: ${tool.toUpperCase()} gewählt`, 'info');
    }

    function handleFileSelect(e) {
      if (e.target.files.length > 0) {
        importFiles(e.target.files);
      }
    }

    function importFiles(fileList) {
      let loadedCount = 0;
      Array.from(fileList).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = function(event) {
          const imgObj = new Image();
          imgObj.onload = function() {
            const id = 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            images.push({
              id: id,
              name: file.name,
              imgElement: imgObj,
              elements: []
            });
            loadedCount++;
            if (loadedCount === fileList.length || images.length === 1 && loadedCount === 1) {
              if (!activeImageId) selectImage(images[images.length - 1].id);
              renderPageOverview();
              updateAppViewStates();
            }
          };
          imgObj.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function updateAppViewStates() {
      const hasImages = images.length > 0;
      document.getElementById('emptyDropzone').style.display = hasImages ? 'none' : 'flex';
      document.getElementById('canvasContainer').style.display = hasImages ? 'flex' : 'none';
      document.getElementById('appToolbar').style.display = hasImages ? 'flex' : 'none';
      document.getElementById('canvasHudOverlay').style.display = hasImages ? 'flex' : 'none';
      document.getElementById('pageCountBadge').textContent = `${images.length} Bilder`;
    }

    function selectImage(id) {
      activeImageId = id;
      currentPolylinePoints = [];
      const imgData = images.find(i => i.id === id);
      if (!imgData) return;
      
      // Reset Workspace Scale View
      scale = 1.0;
      panX = 0;
      panY = 0;
      
      canvas.width = imgData.imgElement.width;
      canvas.height = imgData.imgElement.height;
      
      resizeCanvasToFitImage();
      renderCanvas();
      renderPageOverview();
      
      const index = images.findIndex(i => i.id === id);
      document.getElementById('hudImageNum').textContent = `Bild ${index + 1}/${images.length}`;
      
      // Auto-close open responsive sidebar
      document.getElementById('appSidebar').classList.remove('open');
    }

    function resizeCanvasToFitImage() {
      if (!activeImageId) return;
      const ws = document.getElementById('workspaceContainer');
      const imgData = images.find(i => i.id === activeImageId);
      if (!imgData) return;

      const scaleX = (ws.clientWidth - 40) / imgData.imgElement.width;
      const scaleY = (ws.clientHeight - 40) / imgData.imgElement.height;
      scale = Math.min(scaleX, scaleY, 1.0);
      
      panX = (ws.clientWidth - imgData.imgElement.width * scale) / 2;
      panY = (ws.clientHeight - imgData.imgElement.height * scale) / 2;
      
      applyTransform();
    }

    function applyTransform() {
      const el = document.getElementById('canvasContainer');
      el.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    // ================== CORE DRAWING & INTERACTION ENGINE ==================
    function initPointerEvents() {
      const ws = document.getElementById('workspaceContainer');
      
      ws.addEventListener('pointerdown', handlePointerDown, { passive: false });
      ws.addEventListener('pointermove', handlePointerMove, { passive: false });
      ws.addEventListener('pointerup', handlePointerUp, { passive: false });
      ws.addEventListener('pointercancel', handlePointerUp, { passive: false });
      
      // Wheel Zoom for desktop fallback
      ws.addEventListener('wheel', (e) => {
        if (!activeImageId) return;
        e.preventDefault();
        const zoomFactor = 1.1;
        const oldScale = scale;
        
        if (e.deltaY < 0) scale *= zoomFactor;
        else scale /= zoomFactor;
        
        scale = Math.max(0.1, Math.min(scale, 10.0));
        
        // Adjust zoom anchor to pointer
        const rect = ws.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        panX = mouseX - (mouseX - panX) * (scale / oldScale);
        panY = mouseY - (mouseY - panY) * (scale / oldScale);
        
        applyTransform();
      }, { passive: false });
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      return { x, y };
    }

    function handlePointerDown(e) {
      if (!activeImageId) return;
      
      // Store pointers for Multi-Touch tracking
      pointerCache.push(e);
      
      if (pointerCache.length === 2) {
        // Init multi-touch pinch state
        isDrawing = false;
        isPanning = true;
        prevDiff = Math.hypot(pointerCache[0].clientX - pointerCache[1].clientX, pointerCache[0].clientY - pointerCache[1].clientY);
        startPanX = panX;
        startPanY = panY;
        startPointerX = (pointerCache[0].clientX + pointerCache[1].clientX) / 2;
        startPointerY = (pointerCache[0].clientY + pointerCache[1].clientY) / 2;
        return;
      }

      if (pointerCache.length === 1) {
        const coords = getCanvasCoordinates(e);
        
        if (currentTool === 'pan') {
          isPanning = true;
          startPointerX = e.clientX;
          startPointerY = e.clientY;
          startPanX = panX;
          startPanY = panY;
        } else if (currentTool === 'eraser') {
          executeEraserHitDetection(coords.x, coords.y);
        } else {
          // Drawing active modes
          isDrawing = true;
          canvas.setPointerCapture(e.pointerId);
          startDrawingElement(coords.x, coords.y);
        }
      }
    }

    function handlePointerMove(e) {
      if (!activeImageId) return;
      
      // Update internal pointer positions
      for (let i = 0; i < pointerCache.length; i++) {
        if (e.pointerId === pointerCache[i].pointerId) {
          pointerCache[i] = e;
          break;
        }
      }

      // Handle Pinch-Zoom multi-touch gesture
      if (pointerCache.length === 2) {
        const curDiff = Math.hypot(pointerCache[0].clientX - pointerCache[1].clientX, pointerCache[0].clientY - pointerCache[1].clientY);
        if (prevDiff > 0) {
          const oldScale = scale;
          scale = scale * (curDiff / prevDiff);
          scale = Math.max(0.2, Math.min(scale, 8.0)); // Boundary check
          
          const curPointerX = (pointerCache[0].clientX + pointerCache[1].clientX) / 2;
          const curPointerY = (pointerCache[0].clientY + pointerCache[1].clientY) / 2;
          
          panX = curPointerX - (curPointerX - startPanX) * (scale / oldScale);
          panY = curPointerY - (curPointerY - startPanY) * (scale / oldScale);
          
          applyTransform();
        }
        prevDiff = curDiff;
        return;
      }

      if (pointerCache.length === 1) {
        if (isPanning && currentTool === 'pan') {
          const dx = e.clientX - startPointerX;
          const dy = e.clientY - startPointerY;
          panX = startPanX + dx;
          panY = startPanY + dy;
          applyTransform();
        } else if (isDrawing) {
          const coords = getCanvasCoordinates(e);
          updateDrawingElement(coords.x, coords.y);
        }
      }
    }

    function handlePointerUp(e) {
      removePointerFromCache(e);
      if (pointerCache.length < 2) prevDiff = -1;
      
      if (isDrawing) {
        isDrawing = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
        finishDrawingElement();
      }
      isPanning = false;
    }

    function removePointerFromCache(e) {
      for (let i = 0; i < pointerCache.length; i++) {
        if (pointerCache[i].pointerId === e.pointerId) {
          pointerCache.splice(i, 1);
          break;
        }
      }
    }

    // ================== MARKUP ELEMENT IMPLEMENTATION ==================
    let activeElementData = null;

    function startDrawingElement(x, y) {
      const imgData = images.find(i => i.id === activeImageId);
      if (!imgData) return;

      if (currentTool === 'line') {
        activeElementData = {
          type: 'line',
          subtype: toolSubtype,
          x1: x, y1: y, x2: x, y2: y,
          color: currentColor,
          lineWidth: 5
        };
      } else if (currentTool === 'circle') {
        activeElementData = {
          type: 'circle',
          x: x, y: y, radius: 10,
          color: currentColor,
          lineWidth: 4
        };
      } else if (currentTool === 'rect') {
        activeElementData = {
          type: 'rect',
          x: x, y: y, width: 0, height: 0,
          text: toolSubtype,
          color: currentColor,
          lineWidth: 4
        };
      } else if (currentTool === 'polyline') {
        if (currentPolylinePoints.length === 0) {
          currentPolylinePoints.push({ x: x, y: y });
        }
        currentPolylinePoints.push({ x: x, y: y }); // Drag item marker
        activeElementData = {
          type: 'polyline',
          subtype: toolSubtype,
          points: [...currentPolylinePoints],
          color: currentColor,
          lineWidth: 4
        };
      } else if (currentTool === 'text') {
        isDrawing = false;
        openTextModal("Text hinzufügen", (txt) => {
          if (txt && txt.trim() !== "") {
            imgData.elements.push({
              type: 'text',
              x: x, y: y,
              text: txt,
              color: currentColor,
              fontSize: 24
            });
            renderCanvas();
            renderPageOverview();
          }
        });
      }
    }

    function updateDrawingElement(x, y) {
      if (!activeElementData) return;

      if (activeElementData.type === 'line') {
        activeElementData.x2 = x;
        activeElementData.y2 = y;
      } else if (activeElementData.type === 'circle') {
        activeElementData.radius = Math.hypot(x - activeElementData.x, y - activeElementData.y);
      } else if (activeElementData.type === 'rect') {
        activeElementData.width = x - activeElementData.x;
        activeElementData.height = y - activeElementData.y;
      } else if (activeElementData.type === 'polyline') {
        // Mutate last transient element segment point
        const idx = activeElementData.points.length - 1;
        activeElementData.points[idx] = { x: x, y: y };
        currentPolylinePoints[currentPolylinePoints.length - 1] = { x: x, y: y };
      }

      renderCanvas(activeElementData);
    }

    function finishDrawingElement() {
      if (!activeElementData) return;
      const imgData = images.find(i => i.id === activeImageId);
      if (!imgData) return;

      if (activeElementData.type !== 'polyline') {
        imgData.elements.push(activeElementData);
        activeElementData = null;
        renderCanvas();
        renderPageOverview();
      } else {
        // Multi-stage click handler for polylines
        renderCanvas(activeElementData);
      }
    }

    function commitPolyline() {
      if (currentPolylinePoints.length < 2) return;
      const imgData = images.find(i => i.id === activeImageId);
      if (!imgData) return;

      // Clean drag transient artifact
      if (currentPolylinePoints.length > 1) {
        currentPolylinePoints.pop();
      }

      imgData.elements.push({
        type: 'polyline',
        subtype: toolSubtype,
        points: [...currentPolylinePoints],
        color: currentColor,
        lineWidth: 4
      });

      currentPolylinePoints = [];
      activeElementData = null;
      renderCanvas();
      renderPageOverview();
    }

    // Double tap canvas or execution triggers completion of a multi-point polyline
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && currentTool === 'polyline') {
        commitPolyline();
      }
    });

    // ================== ELEMENT HIT-DETECTION & ERASER ==================
    function executeEraserHitDetection(x, y) {
      const imgData = images.find(i => i.id === activeImageId);
      if (!imgData) return;

      const buffer = 24; // Threshold size in px for touch interaction
      let deletedAny = false;

      // Traversal from top to bottom (reverse order array)
      for (let i = imgData.elements.length - 1; i >= 0; i--) {
        const elem = imgData.elements[i];
        let hit = false;

        if (elem.type === 'line') {
          hit = isPointNearLine(x, y, elem.x1, elem.y1, elem.x2, elem.y2, buffer);
        } else if (elem.type === 'circle') {
          const dist = Math.hypot(x - elem.x, y - elem.y);
          hit = Math.abs(dist - elem.radius) <= buffer || dist <= buffer;
        } else if (elem.type === 'rect') {
          hit = (x >= Math.min(elem.x, elem.x + elem.width) - buffer &&
                 x <= Math.max(elem.x, elem.x + elem.width) + buffer &&
                 y >= Math.min(elem.y, elem.y + elem.height) - buffer &&
                 y <= Math.max(elem.y, elem.y + elem.height) + buffer);
        } else if (elem.type === 'text') {
          hit = Math.hypot(x - elem.x, y - elem.y) <= buffer * 1.5;
        } else if (elem.type === 'polyline') {
          for (let j = 0; j < elem.points.length - 1; j++) {
            if (isPointNearLine(x, y, elem.points[j].x, elem.points[j].y, elem.points[j+1].x, elem.points[j+1].y, buffer)) {
              hit = true;
              break;
            }
          }
        }

        if (hit) {
          imgData.elements.splice(i, 1);
          deletedAny = true;
          showStatus("Element entfernt 🗑️", "success");
          break; // Click deletes top element only
        }
      }

      if (deletedAny) {
        renderCanvas();
        renderPageOverview();
      }
    }

    function isPointNearLine(px, py, x1, y1, x2, y2, maxDistance) {
      const A = px - x1;
      const B = py - y1;
      const C = x2 - x1;
      const D = y2 - y1;

      const dot = A * C + B * D;
      const lenSq = C * C + D * D;
      let param = -1;
      
      if (lenSq !== 0) param = dot / lenSq;

      let xx, yy;

      if (param < 0) {
        xx = x1;
        yy = y1;
      } else if (param > 1) {
        xx = x2;
        yy = y2;
      } else {
        xx = x1 + param * C;
        yy = y1 + param * D;
      }

      const dx = px - xx;
      const dy = py - yy;
      return Math.hypot(dx, dy) <= maxDistance;
    }

    // UNDO: Segment-wise for active drawing/polyline or last element
    function executeUndo() {
      const imgData = images.find(i => i.id === activeImageId);
      if (!imgData) return;

      // If user is currently drawing a polyline, undo segment-wise
      if (currentTool === 'polyline' && currentPolylinePoints.length > 0) {
        currentPolylinePoints.pop(); // Remove preview marker coordinate
        if (currentPolylinePoints.length > 0) {
          currentPolylinePoints.pop(); // Remove active segment point
        }
        
        if (currentPolylinePoints.length === 0) {
          activeElementData = null;
          showStatus("Zeichnung zurückgesetzt", "info");
        } else {
          // Re-insert working preview coordinate tracking point
          const lastPoint = currentPolylinePoints[currentPolylinePoints.length - 1];
          currentPolylinePoints.push({ x: lastPoint.x, y: lastPoint.y });
          activeElementData.points = [...currentPolylinePoints];
        }
        renderCanvas(activeElementData);
        return;
      }

      // Default fallback: remove last element complete array entry
      if (imgData.elements.length > 0) {
        imgData.elements.pop();
        showStatus("Schritt zurück ausgeführt ↩️", "info");
        renderCanvas();
        renderPageOverview();
      } else {
        showStatus("Nichts zum Rückgängig machen", "error");
      }
    }

    // ================== RENDER PIPELINE ==================
    function renderCanvas(transientElement = null) {
      if (!activeImageId) return;
      const imgData = images.find(i => i.id === activeImageId);
      if (!imgData) return;

      // Clear Context
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw Base Image
      ctx.drawImage(imgData.imgElement, 0, 0);

      // Render Static Committed Elements
      imgData.elements.forEach(elem => drawSingleElement(ctx, elem));

      // Render Active Live Transient Component Overlay
      if (transientElement) {
        drawSingleElement(ctx, transientElement);
      }
    }

    function drawSingleElement(targetCtx, elem) {
      targetCtx.lineWidth = elem.lineWidth || 4;
      targetCtx.strokeStyle = elem.color;
      targetCtx.fillStyle = elem.color;
      targetCtx.lineCap = "round";
      targetCtx.lineJoin = "round";

      switch (elem.type) {
        case 'line':
          targetCtx.beginPath();
          targetCtx.moveTo(elem.x1, elem.y1);
          targetCtx.lineTo(elem.x2, elem.y2);
          targetCtx.stroke();
          
          // Draw standard metadata connectors if drilling subtype specified
          if (elem.subtype === 'outside' || elem.subtype === 'inside') {
             // No additional sub-render required
          }
          break;

        case 'circle':
          targetCtx.beginPath();
          // Transparent Circle Specification -> outline only, NO inner fill!
          targetCtx.arc(elem.x, elem.y, elem.radius, 0, 2 * Math.PI);
          targetCtx.stroke();
          break;

        case 'rect':
          targetCtx.beginPath();
          targetCtx.rect(elem.x, elem.y, elem.width, elem.height);
          targetCtx.stroke();
          
          if (elem.text) {
            targetCtx.font = "bold 20px -apple-system, sans-serif";
            targetCtx.fillStyle = elem.color;
            targetCtx.fillText(elem.text, elem.x + 6, elem.y + 24);
          }
          break;

        case 'text':
          targetCtx.font = `bold ${elem.fontSize || 24}px -apple-system, sans-serif`;
          targetCtx.fillStyle = elem.color;
          targetCtx.textBaseline = "top";
          targetCtx.fillText(elem.text, elem.x, elem.y);
          break;

        case 'polyline':
          if (elem.points.length < 1) return;
          targetCtx.beginPath();
          targetCtx.moveTo(elem.points[0].x, elem.points[0].y);
          for (let i = 1; i < elem.points.length; i++) {
            targetCtx.lineTo(elem.points[i].x, elem.points[i].y);
          }
          targetCtx.stroke();

          // Render End Circle Nodes depending on drilling selection parameters
          const finalPoint = elem.points[elem.points.length - 1];
          if (elem.subtype === 'vert') {
            targetCtx.beginPath();
            targetCtx.strokeStyle = '#ffd60a'; // Yellow Kreis
            targetCtx.arc(finalPoint.x, finalPoint.y, 14, 0, 2 * Math.PI);
            targetCtx.stroke();
          } else if (elem.subtype === 'horiz') {
            targetCtx.beginPath();
            targetCtx.strokeStyle = '#ff453a'; // Roter Kreis
            targetCtx.arc(finalPoint.x, finalPoint.y, 14, 0, 2 * Math.PI);
            targetCtx.stroke();
          }
          break;
      }
    }

    // ================== PAGE OVERVIEW & DRAG-DROP SYSTEM ==================
    function renderPageOverview() {
      const container = document.getElementById('pageListContainer');
      container.innerHTML = '';

      images.forEach((imgData, index) => {
        const item = document.createElement('div');
        item.className = `page-item ${imgData.id === activeImageId ? 'active' : ''}`;
        item.setAttribute('draggable', 'true');
        item.dataset.index = index;

        // Custom PointerEvent Handling to prevent native browser engine scroll interference
        item.addEventListener('dragstart', (e) => {
          draggedItemIndex = index;
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          draggedItemIndex = null;
        });

        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          const targetItem = e.target.closest('.page-item');
          if (targetItem && draggedItemIndex !== null && draggedItemIndex !== index) {
            const bounding = targetItem.getBoundingClientRect();
            const offset = e.clientY - bounding.top;
            if (offset > bounding.height / 2) {
              targetItem.after(item);
            } else {
              targetItem.before(item);
            }
          }
        });

        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const newContainerOrder = Array.from(container.children).map(child => parseInt(child.dataset.index));
          const reorderedImages = newContainerOrder.map(idx => images[idx]);
          images = reorderedImages;
          renderPageOverview();
          
          // Re-calculate visible image tracker HUD bounds
          const currentNewIndex = images.findIndex(i => i.id === activeImageId);
          document.getElementById('hudImageNum').textContent = `Bild ${currentNewIndex + 1}/${images.length}`;
        });

        // Touch event reordering fallback wrapper for iPad
        item.addEventListener('touchstart', (e) => {
          if(currentTool === 'pan') {
             // Let user select page via tap execution
             selectImage(imgData.id);
          }
        }, {passive: true});

        item.onclick = () => selectImage(imgData.id);

        // Generate Thumb-Preview via dynamic canvas representation
        const thumbContainer = document.createElement('div');
        thumbContainer.className = 'page-thumb-container';

        const thumbCanvas = document.createElement('canvas');
        // Low resolution footprint for performance optimization
        thumbCanvas.width = 160;
        thumbCanvas.height = 120;
        const thumbCtx = thumbCanvas.getContext('2d');
        
        // Scale and draw thumbnail representation bounds
        const scaleFit = Math.min(160 / imgData.imgElement.width, 120 / imgData.imgElement.height);
        const tw = imgData.imgElement.width * scaleFit;
        const th = imgData.imgElement.height * scaleFit;
        
        thumbCtx.drawImage(imgData.imgElement, (160 - tw)/2, (120 - th)/2, tw, th);
        
        // Render layers on thumbnail preview
        thumbCtx.save();
        thumbCtx.scale(scaleFit, scaleFit);
        thumbCtx.translate(((160 - tw)/2)/scaleFit, ((120 - th)/2)/scaleFit);
        imgData.elements.forEach(elem => drawSingleElement(thumbCtx, elem));
        thumbCtx.restore();

        const imgThumb = document.createElement('img');
        imgThumb.className = 'page-thumb';
        imgThumb.src = thumbCanvas.toDataURL('image/jpeg', 0.5);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete-page';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteImageAtIndex(index);
        };

        const meta = document.createElement('div');
        meta.className = 'page-meta';
        meta.innerHTML = `<span>Bild ${index + 1}</span><span class="page-badge" style="background:transparent; color:var(--text-muted);">${imgData.elements.length} Mark.</span>`;

        thumbContainer.appendChild(imgThumb);
        thumbContainer.appendChild(deleteBtn);
        item.appendChild(thumbContainer);
        item.appendChild(meta);
        container.appendChild(item);
      });
    }

    function deleteImageAtIndex(idx) {
      if (!confirm('Dieses Bild aus der Hausbegehung entfernen?')) return;
      const targetId = images[idx].id;
      images.splice(idx, 1);
      
      if (activeImageId === targetId) {
        activeImageId = images.length > 0 ? images[images.length - 1].id : null;
      }
      
      if (activeImageId) selectImage(activeImageId);
      else {
        updateAppViewStates();
        renderPageOverview();
      }
      showStatus("Bild gelöscht", "info");
    }

    function clearAllImages() {
      if (!confirm('Möchten Sie wirklich ALLE Bilder dieser Begehung löschen?')) return;
      images = [];
      activeImageId = null;
      currentPolylinePoints = [];
      document.getElementById('addressInput').value = '';
      updateAddressWatermark();
      updateAppViewStates();
      renderPageOverview();
      showStatus("Alles zurückgesetzt 🗑️", "info");
    }

    // ================== HIGH QUALITY EXPORT WORKER PIPELINE ==================
    function processHdImageBlob(imgData, index, addressStr) {
      return new Promise((resolve) => {
        const hdCanvas = document.createElement('canvas');
        hdCanvas.width = imgData.imgElement.width;
        hdCanvas.height = imgData.imgElement.height;
        
        const hdCtx = hdCanvas.getContext('2d');
        hdCtx.imageSmoothingEnabled = true;
        hdCtx.imageSmoothingQuality = 'high';
        
        // Draw native original high resolution image footprint
        hdCtx.drawImage(imgData.imgElement, 0, 0);
        
        // Draw markup vector annotations
        imgData.elements.forEach(elem => drawSingleElement(hdCtx, elem));
        
        // Inject / Burn immutable text annotations into image center bottom layer
        const padding = 24;
        hdCtx.save();
        
        // 1. Burn Auto-Numbering Center
        const numberingText = `Bild ${index + 1} - AI Initiative EU`;
        hdCtx.font = "bold 32px -apple-system, sans-serif";
        const numWidth = hdCtx.measureText(numberingText).width;
        
        hdCtx.fillStyle = "rgba(0, 0, 0, 0.65)";
        hdCtx.fillRect((hdCanvas.width - numWidth) / 2 - 16, hdCanvas.height - 70, numWidth + 32, 50);
        
        hdCtx.fillStyle = "#ffffff";
        hdCtx.textBaseline = "middle";
        hdCtx.fillText(numberingText, (hdCanvas.width - numWidth) / 2, hdCanvas.height - 45);

        // 2. Burn Custom Address Watermark Left if specified
        if (addressStr && addressStr.trim() !== "") {
          hdCtx.font = "600 26px -apple-system, sans-serif";
          const addrWidth = hdCtx.measureText(addressStr).width;
          
          hdCtx.fillStyle = "rgba(0, 0, 0, 0.6)";
          hdCtx.fillRect(20, 20, addrWidth + 24, 44);
          
          hdCtx.fillStyle = "#30d158"; // Green accent verification color token
          hdCtx.fillText(addressStr, 32, 42);
        }
        
        hdCtx.restore();

        // Convert context to blob format stream at maximum scale (1.0 HD target)
        hdCanvas.toBlob((blob) => {
          resolve(blob);
        }, 'image/jpeg', 1.0);
      });
    }

    async function exportAllToZIP() {
      if (images.length === 0) {
        showStatus("Keine Bilder zum Exportieren vorhanden", "error");
        return;
      }

      showStatus("Generiere hochauflösenden HD-Export... Bitte warten.", "info");
      const zip = new JSZip();
      
      const rawAddr = document.getElementById('addressInput').value;
      const sanitizedAddress = rawAddr ? rawAddr.replace(/[/\\?%*:|"<>\s]/g, '_') : 'Unbekannte_Adresse';
      const folderName = `Hausbegehung_${sanitizedAddress}`;
      const imgFolder = zip.folder(folderName);

      for (let i = 0; i < images.length; i++) {
        const imgData = images[i];
        const blob = await processHdImageBlob(imgData, i, rawAddr);
        
        // Structured naming schema matching requirements
        const outFilename = `Begehung_${sanitizedAddress}_Bild_${i + 1}.jpg`;
        imgFolder.file(outFilename, blob);
      }

      const archiveBlob = await zip.generateAsync({ type: 'blob' });
      const downloadName = `Hausbegehung_${sanitizedAddress}_${new Date().toISOString().slice(0, 10)}.zip`;
      
      const url = URL.createObjectURL(archiveBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = downloadName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      showStatus(`✅ ZIP-Archiv erfolgreich erstellt (${images.length} HD Bilder)`, "success");
    }

    // ================== MODAL HELPER TEXT ENGINE ==================
    let modalCallbackFn = null;

    function openTextModal(title, callback) {
      document.getElementById('textModalTitle').textContent = title;
      const input = document.getElementById('textModalInput');
      input.value = '';
      modalCallbackFn = callback;
      document.getElementById('textModal').classList.add('open');
      setTimeout(() => input.focus(), 100);
    }

    function closeTextModal(shouldCommit) {
      document.getElementById('textModal').classList.remove('open');
      if (modalCallbackFn) {
        const val = document.getElementById('textModalInput').value;
        modalCallbackFn(shouldCommit ? val : null);
      }
      modalCallbackFn = null;
    }

    function showStatus(msg, type) {
      const bar = document.getElementById('statusBar');
      bar.textContent = msg;
      bar.className = `status-${type}`;
      bar.style.display = 'block';
      
      // Auto toggle hide out banner state animation interval
      if (window.statusTimeout) clearTimeout(window.statusTimeout);
      window.statusTimeout = setTimeout(() => {
        bar.style.display = 'none';
      }, 3500);
    }
  </script>
</body>
</html>
